<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oyster's LAB — Админ-панель</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&display=swap');

:root {
    --bg: #060a10;
    --bg-card: #0c1118;
    --surface: #111820;
    --surface-2: #171f2a;
    --gold: #d4b062;
    --gold-light: #e8cc8a;
    --gold-dim: rgba(212,176,98,0.08);
    --gold-line: rgba(212,176,98,0.18);
    --text: #f0ece4;
    --text-sec: #c8c0b4;
    --muted: #7a8fa3;
    --faint: #1a222e;
    --danger: #e05a5a;
    --danger-dim: rgba(224,90,90,0.1);
    --danger-line: rgba(224,90,90,0.25);
    --green: #6bcf8e;
    --green-dim: rgba(107,207,142,0.1);
    --radius: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;
    --fs-xs: 0.75rem;
    --fs-sm: 0.875rem;
    --fs-base: 1rem;
    --fs-md: 1.25rem;
    --fs-lg: 1.563rem;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: var(--fs-base);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}
select, input, textarea, button { font-family: inherit; color-scheme: dark; }
select option { background: var(--bg-card); color: var(--text); }
button { cursor: pointer; }
h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--text); }

.shell { width: 100%; max-width: 560px; min-height: 100vh; min-height: 100dvh; position: relative; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

/* ─── LOGIN ─── */
.login-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 360px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 36px 28px; text-align: center; }
.login-icon { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: var(--gold-dim); border: 1px solid var(--gold-line); display: flex; align-items: center; justify-content: center; color: var(--gold); }
.login-card h1 { font-size: var(--fs-lg); letter-spacing: 1px; margin-bottom: 4px; }
.login-sub { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 28px; letter-spacing: 0.04em; text-transform: uppercase; }
.field-wrap { position: relative; margin-bottom: 14px; }
.field-wrap input { width: 100%; padding: 13px 44px 13px 16px; background: var(--surface); border: 1px solid var(--faint); border-radius: var(--radius-sm); color: var(--text); font-size: var(--fs-base); transition: border-color .2s; }
.field-wrap input:focus { outline: none; border-color: var(--gold-line); }
.field-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
.field-toggle:hover { color: var(--text); }
.btn-primary { width: 100%; background: var(--gold-dim); border: 1px solid var(--gold-line); color: var(--gold-light); font-weight: 700; font-size: var(--fs-base); padding: 14px; border-radius: var(--radius-sm); transition: all .2s; }
.btn-primary:hover { background: var(--gold-line); color: var(--text); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.login-error { color: var(--danger); font-size: var(--fs-sm); margin-top: 14px; min-height: 18px; }

/* ─── HEADER ─── */
header { padding: calc(18px + env(safe-area-inset-top)) 20px 14px; position: sticky; top: 0; z-index: 50; background: rgba(6,10,16,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--faint); }
.header-row { display: flex; justify-content: space-between; align-items: center; }
.brand h1 { font-size: var(--fs-md); letter-spacing: 3px; text-transform: uppercase; }
.brand p { font-size: 0.65rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: var(--radius-xs); background: var(--surface); border: 1px solid var(--faint); color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
.icon-btn:hover { border-color: var(--gold-line); color: var(--text); }
.icon-btn.danger-hover:hover { border-color: var(--danger-line); color: var(--danger); }

/* ─── NAV TABS ─── */
.nav-tabs { display: flex; gap: 8px; padding: 14px 20px 0; }
.nav-tab { flex: 1; background: var(--surface); border: 1px solid var(--faint); color: var(--muted); font-size: var(--fs-sm); font-weight: 600; padding: 11px 6px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s; }
.nav-tab.active { background: var(--gold-dim); color: var(--gold-light); border-color: var(--gold-line); }
.nav-tab .count { font-size: 0.7rem; opacity: 0.7; }

/* ─── SEARCH ─── */
.search-wrap { padding: 14px 20px 0; position: relative; }
.search-wrap svg { position: absolute; left: 34px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-wrap input { width: 100%; padding: 11px 14px 11px 40px; background: var(--surface); border: 1px solid var(--faint); border-radius: var(--radius-sm); color: var(--text); font-size: var(--fs-sm); }
.search-wrap input:focus { outline: none; border-color: var(--gold-line); }

/* ─── LIST ─── */
.list { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.item-card { display: flex; gap: 12px; align-items: center; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 12px; }
.item-thumb { width: 56px; height: 56px; flex-shrink: 0; border-radius: var(--radius-xs); background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--gold); opacity: 0.8; overflow: hidden; }
.item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: var(--fs-base); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.item-actions .icon-btn { width: 34px; height: 34px; }

.empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-state svg { opacity: 0.35; margin-bottom: 14px; }
.empty-state p { font-size: var(--fs-sm); line-height: 1.6; }

.skeleton { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.skel-card { height: 80px; border-radius: var(--radius); background: linear-gradient(90deg, var(--bg-card) 25%, var(--surface) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ─── FAB ─── */
.fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 50%; transform: translateX(calc(280px - 24px - 56px)); width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--gold-light), var(--gold)); border: none; display: flex; align-items: center; justify-content: center; color: var(--bg); box-shadow: 0 8px 24px rgba(212,176,98,0.35); z-index: 60; transition: transform .2s; }
.fab:active { transform: translateX(calc(280px - 24px - 56px)) scale(0.94); }
@media (max-width: 560px) {
    .fab { right: 24px; transform: none; }
    .fab:active { transform: scale(0.94); }
}

/* ─── TOASTS ─── */
.toast-stack { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column-reverse; gap: 8px; width: calc(100% - 40px); max-width: 400px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius-sm); padding: 12px 16px; font-size: var(--fs-sm); color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn .25s ease; max-width: 100%; }
.toast.success { border-color: rgba(107,207,142,0.3); }
.toast.error { border-color: var(--danger-line); }
.toast svg { flex-shrink: 0; }
.toast.success svg { color: var(--green); }
.toast.error svg { color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.toast.leaving { animation: toastOut .2s ease forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ─── SHEET (МОДАЛКА) ─── */
.sheet-overlay { position: fixed; inset: 0; background: rgba(6,10,16,0.75); backdrop-filter: blur(8px); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.sheet-overlay.active { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; background: var(--bg-card); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: sheetUp .3s cubic-bezier(0.22,1,0.36,1); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle { width: 36px; height: 4px; background: var(--faint); border-radius: 2px; margin: 10px auto 4px; flex-shrink: 0; }
.sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 16px; flex-shrink: 0; border-bottom: 1px solid var(--faint); }
.sheet-header h2 { font-size: var(--fs-md); }
.sheet-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.sheet-footer { display: flex; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--faint); flex-shrink: 0; }
.sheet-footer .btn-primary { flex: 1; }
.btn-ghost { flex: 1; background: var(--surface); border: 1px solid var(--faint); color: var(--muted); font-weight: 600; font-size: var(--fs-base); padding: 14px; border-radius: var(--radius-sm); transition: all .2s; }
.btn-ghost:hover { border-color: var(--gold-line); color: var(--text); }

/* ─── ФОРМА ─── */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--faint); border-radius: var(--radius-xs); color: var(--text); font-size: var(--fs-base); transition: border-color .2s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--gold-line); }
.form-input[readonly] { opacity: 0.55; }
.form-textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.form-hint { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
.form-error-text { font-size: var(--fs-xs); color: var(--danger); margin-top: 6px; }

.section-divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 16px; }
.section-divider span { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.section-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-line), transparent); }

/* Переключатель языка внутри формы */
.lang-tabs { display: inline-flex; gap: 3px; background: var(--surface); padding: 3px; border-radius: 20px; border: 1px solid var(--faint); margin-bottom: 16px; }
.lang-tab { background: transparent; border: none; color: var(--muted); font-size: var(--fs-xs); font-weight: 700; padding: 8px 16px; border-radius: 16px; text-transform: uppercase; transition: all .2s; }
.lang-tab.active { background: var(--gold-dim); color: var(--gold-light); }
.lang-tab .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--danger); margin-left: 5px; opacity: 0; transition: opacity .2s; position: relative; top: -5px; }
.lang-tab .dot.show { opacity: 1; }
.lang-field { display: none; }
.lang-field.active { display: block; }

/* Слайдеры вкуса */
.taste-slider { margin-bottom: 16px; }
.taste-slider-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: var(--fs-sm); }
.taste-slider-top .label { color: var(--text-sec); font-weight: 600; }
.taste-slider-top .val { color: var(--gold-light); font-weight: 700; }
.taste-slider input[type=range] { width: 100%; -webkit-appearance: none; height: 6px; border-radius: 3px; background: var(--faint); outline: none; }
.taste-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); border: 3px solid var(--bg-card); box-shadow: 0 0 0 1px var(--gold-line); cursor: pointer; }
.taste-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }

.facts-fields { display: flex; flex-direction: column; gap: 8px; }

/* Загрузка изображения */
.image-uploader { display: flex; gap: 14px; align-items: center; }
.image-preview-box { width: 84px; height: 84px; border-radius: var(--radius-sm); background: var(--surface); border: 1.5px dashed var(--gold-line); display: flex; align-items: center; justify-content: center; color: var(--gold); position: relative; overflow: hidden; flex-shrink: 0; }
.image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-box .remove-img { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(6,10,16,0.85); border-radius: 50%; display: none; align-items: center; justify-content: center; color: var(--text); }
.image-preview-box.has-img .remove-img { display: flex; }
.image-uploader-actions { flex: 1; }
.upload-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--faint); color: var(--text-sec); font-size: var(--fs-sm); font-weight: 600; padding: 10px 16px; border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.upload-btn:hover { border-color: var(--gold-line); }
.upload-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-status { font-size: var(--fs-xs); margin-top: 8px; }
.upload-status.error { color: var(--danger); }
.upload-status.loading { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── CONFIRM MODAL ─── */
.confirm-overlay { position: fixed; inset: 0; background: rgba(6,10,16,0.75); backdrop-filter: blur(8px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 24px; }
.confirm-overlay.active { display: flex; }
.confirm-card { width: 100%; max-width: 340px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 26px 22px; text-align: center; animation: sheetUp .25s ease; }
.confirm-icon { width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 14px; background: var(--danger-dim); border: 1px solid var(--danger-line); color: var(--danger); display: flex; align-items: center; justify-content: center; }
.confirm-card h3 { font-size: var(--fs-md); margin-bottom: 8px; }
.confirm-card p { font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; margin-bottom: 22px; }
.confirm-actions { display: flex; gap: 10px; }
.btn-danger { flex: 1; background: var(--danger-dim); border: 1px solid var(--danger-line); color: var(--danger); font-weight: 700; font-size: var(--fs-base); padding: 13px; border-radius: var(--radius-sm); }
.btn-danger:hover { background: var(--danger); color: var(--text); }

.hidden { display: none !important; }
::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="login-wrap" id="loginScreen">
    <div class="login-card">
        <div class="login-icon" id="loginIcon"></div>
        <h1>Oyster's LAB</h1>
        <p class="login-sub">Панель управления</p>
        <div class="field-wrap">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button class="field-toggle" id="togglePassword"></button>
        </div>
        <button class="btn-primary" id="loginBtn">Войти</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div class="shell hidden" id="app">
    <header>
        <div class="header-row">
            <div class="brand">
                <h1>Oyster's LAB</h1>
                <p>Админ-панель</p>
            </div>
            <button class="icon-btn danger-hover" id="logoutBtn" title="Выйти"></button>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="oysters">Устрицы <span class="count" id="countOysters"></span></button>
        <button class="nav-tab" data-tab="categories">Категории <span class="count" id="countCategories"></span></button>
        <button class="nav-tab" data-tab="items">Блюда <span class="count" id="countItems"></span></button>
    </div>

    <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск...">
    </div>

    <div id="listContainer"></div>
</div>

<button class="fab hidden" id="fabAdd"></button>

<!-- BOTTOM SHEET (форма) -->
<div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle"></h2>
            <button class="icon-btn" id="sheetClose"></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-footer">
            <button class="btn-ghost" id="sheetCancel">Отмена</button>
            <button class="btn-primary" id="sheetSave">Сохранить</button>
        </div>
    </div>
</div>

<!-- ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-card">
        <div class="confirm-icon" id="confirmIcon"></div>
        <h3>Удалить?</h3>
        <p id="confirmText"></p>
        <div class="confirm-actions">
            <button class="btn-ghost" id="confirmCancel">Отмена</button>
            <button class="btn-danger" id="confirmOk">Удалить</button>
        </div>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
// ==================== ИКОНКИ ====================
const ICON = {
    oyster: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/><path d="M8 14c0-2.2 1.8-4 4-4s4 1.8 4 4"/><path d="M10 10c0-1.1.9-2 2-2s2 .9 2 2"/></svg>',
    eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a19.6 19.6 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a19.6 19.6 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>',
    logout: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
    plus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>',

// ==================== ТОСТЫ ====================
function toast(message, type = 'success') {
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `${type === 'success' ? ICON.check : ICON.warn}<span>${escapeHtml(message)}</span>`;
    stack.appendChild(el);
    setTimeout(() => {
        el.classList.add('leaving');
        setTimeout(() => el.remove(), 200);
    }, 3200);
}

// ==================== УТИЛИТЫ ====================
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function loc(value, lang) {
    if (value == null) return '';
    if (typeof value === 'object') return value[lang] || value.ru || '';
    return value;
}
function ensureLangObj(value) {
    if (value && typeof value === 'object') return { ru: value.ru || '', ro: value.ro || '', en: value.en || '' };
    if (typeof value === 'string') return { ru: value, ro: '', en: '' };
    return { ru: '', ro: '', en: '' };
}

// ==================== СЕТЕВОЙ СЛОЙ ====================
async function apiFetch(url, options = {}) {
    let res;
    try {
        res = await fetch(url, { ...options, headers: { ...(options.headers||{}), 'Authorization': `Bearer ${authToken}` } });
    } catch {
        toast('Ошибка сети', 'error');
        throw new Error('network');
    }
    if (res.status === 401) {
        authToken = '';
        localStorage.removeItem('admin_token');
        document.getElementById('app').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginError').textContent = 'Сессия истекла, войдите снова';
        throw new Error('unauthorized');
    }
    if (!res.ok) {
        let msg = 'Ошибка запроса';
        try { const d = await res.clone().json(); msg = d.error || msg; } catch {}
        toast(msg, 'error');
        throw new Error(msg);
    }
    return res;
}

async function doLogin() {
    const password = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.textContent = '';
    if (!password) { err.textContent = 'Введите пароль'; return; }
    btn.disabled = true;
    try {
        const res = await fetch('/api/auth', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
        const data = await res.json();
        if (data.token) {
            authToken = data.token;
            localStorage.setItem('admin_token', authToken);
            showApp();
        } else {
            err.textContent = data.error || 'Ошибка входа';
        }
    } catch {
        err.textContent = 'Ошибка сети';
    } finally {
        btn.disabled = false;
    }
}

function renderList() {
    const container = document.getElementById('listContainer');
    let data, cardsHtml;

    if (currentTab === 'oysters') {
        data = oystersData.filter(o => !searchQuery || (o.name||'').toLowerCase().includes(searchQuery));
        if (!data.length) return renderEmpty(container, oystersData.length ? 'Ничего не найдено' : 'Пока нет устриц. Добавьте первую.');
        cardsHtml = data.map(o => `
            <div class="item-card">
                <div class="item-thumb">${o.image_url ? `<img src="${escapeHtml(o.image_url)}">` : ICON.oyster}</div>
                <div class="item-info">
                    <div class="item-name">${escapeHtml(o.name)}</div>
                    <div class="item-sub">${escapeHtml(o.badge||'')} · ${o.price ?? 0} MDL</div>
                </div>
                <div class="item-actions">
                    <button class="icon-btn" onclick="openEditModal('oysters','${o.id}')">${ICON.edit}</button>
                    <button class="icon-btn danger-hover" onclick="askDelete('oysters','${o.id}','${escapeHtml(o.name)}')">${ICON.trash}</button>
                </div>
            </div>`).join('');
    } else if (currentTab === 'categories') {
        data = categoriesData.filter(c => !searchQuery || (c.label?.ru||c.id||'').toLowerCase().includes(searchQuery));
        if (!data.length) return renderEmpty(container, categoriesData.length ? 'Ничего не найдено' : 'Пока нет категорий. Добавьте первую.');
        cardsHtml = data.map(c => `
            <div class="item-card">
                <div class="item-thumb">${ICON.plate}</div>
                <div class="item-info">
                    <div class="item-name">${escapeHtml(c.label?.ru || c.id)}</div>
                    <div class="item-sub">${c.sort_order ? 'Порядок: ' + c.sort_order : c.id}</div>
                </div>
                <div class="item-actions">
                    <button class="icon-btn" onclick="openEditModal('categories','${c.id}')">${ICON.edit}</button>
                    <button class="icon-btn danger-hover" onclick="askDelete('categories','${c.id}','${escapeHtml(c.label?.ru || c.id)}')">${ICON.trash}</button>
                </div>
            </div>`).join('');
    } else {
        data = itemsData.filter(i => {
            const n = (i.name && typeof i.name === 'object') ? (i.name.ru||'') : (i.name||'');
            return !searchQuery || n.toLowerCase().includes(searchQuery);
        });
        if (!data.length) return renderEmpty(container, itemsData.length ? 'Ничего не найдено' : 'Пока нет блюд. Добавьте первое.');
        cardsHtml = data.map(item => {
            const name = (item.name && typeof item.name === 'object') ? (item.name.ru || item.name.en || '') : (item.name || '');
            const cat = categoriesData.find(c => c.id === item.category_id);
            return `
            <div class="item-card">
                <div class="item-thumb">${item.image_url ? `<img src="${escapeHtml(item.image_url)}">` : ICON.plate}</div>
                <div class="item-info">
                    <div class="item-name">${escapeHtml(name)}</div>
                    <div class="item-sub">${escapeHtml(cat?.label?.ru || item.category_id || '')} · ${item.price ?? 0} MDL</div>
                </div>
                <div class="item-actions">
                    <button class="icon-btn" onclick="openEditModal('items','${item.id}')">${ICON.edit}</button>
                    <button class="icon-btn danger-hover" onclick="askDelete('items','${item.id}','${escapeHtml(name)}')">${ICON.trash}</button>
                </div>
            </div>`;
        }).join('');
    }

    container.innerHTML = `<div class="list">${cardsHtml}</div>`;
}

        <div class="form-group">
            <label class="form-label">Порядок отображения</label>
            <input class="form-input" type="number" id="f_sort_order" value="${d.sort_order ?? 0}">
        </div>

        <div class="section-divider"><span>Тексты по языкам</span></div>
        ${langTabsHtml(l => name[l] && desc[l])}
        ${['ru','ro','en'].map(l => `
            <div class="lang-field ${l==='ru'?'active':''}" data-lang="${l}">
                <div class="form-group">
                    <label class="form-label">Название</label>
                    <input class="form-input" id="f_name_${l}" value="${escapeHtml(name[l])}">
                </div>
                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-textarea" id="f_description_${l}">${escapeHtml(desc[l])}</textarea>
                </div>
            </div>
        `).join('')}

        <div class="section-divider"><span>Фотография</span></div>
        ${imageUploaderHtml(d.image_url)}
    `;
}

// ---------- Общий блок загрузки фото ----------
function imageUploaderHtml(imageUrl) {
    return `
        <div class="image-uploader">
            <div class="image-preview-box ${imageUrl ? 'has-img' : ''}" id="imagePreviewBox">
                ${imageUrl ? `<img src="${escapeHtml(imageUrl)}">` : ICON.camera}
                <button type="button" class="remove-img" id="removeImageBtn">${ICON.close}</button>
            </div>
            <div class="image-uploader-actions">
                <label class="upload-btn">${ICON.camera} <span id="uploadBtnLabel">${imageUrl ? 'Заменить фото' : 'Загрузить фото'}</span>
                    <input type="file" accept="image/*" id="imageFileInput">
                </label>
                <div class="upload-status hidden" id="uploadStatus"></div>
            </div>
        </div>
        <input type="hidden" id="f_image_url" value="${escapeHtml(imageUrl || '')}">
    `;
}

function bindImageUploaders() {
    const fileInput = document.getElementById('imageFileInput');
    const removeBtn = document.getElementById('removeImageBtn');
    if (!fileInput) return;

    fileInput.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        const status = document.getElementById('uploadStatus');
        const MAX = 5 * 1024 * 1024;
        if (file.size > MAX) {
            status.className = 'upload-status error';
            status.textContent = 'Файл слишком большой (макс. 5 МБ)';
            fileInput.value = '';
            return;
        }
        status.className = 'upload-status loading';
        status.innerHTML = `${ICON.spinner} Загрузка...`;

        const reader = new FileReader();
        reader.onload = async () => {
            try {
                const base64 = reader.result.split(',')[1];
                const fileName = `${Date.now()}_${file.name}`.replace(/[^a-zA-Z0-9._-]/g, '_');
                const res = await apiFetch('/api/upload-image', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName, fileBase64: base64, contentType: file.type })
                });
                const data = await res.json();
                if (data.url) {
                    document.getElementById('f_image_url').value = data.url;
                    const box = document.getElementById('imagePreviewBox');
                    box.classList.add('has-img');
                    box.innerHTML = `<img src="${data.url}"><button type="button" class="remove-img" id="removeImageBtn">${ICON.close}</button>`;
                    document.getElementById('uploadBtnLabel').textContent = 'Заменить фото';
                    document.getElementById('removeImageBtn').addEventListener('click', clearImage);
                    status.className = 'upload-status hidden';
                } else {
                    status.className = 'upload-status error';
                    status.textContent = data.error || 'Ошибка загрузки';
                }
            } catch {
                status.className = 'upload-status error';
                status.textContent = 'Ошибка загрузки изображения';
            }
        };
        reader.readAsDataURL(file);
    });

    if (removeBtn) removeBtn.addEventListener('click', clearImage);
}

function clearImage() {
    document.getElementById('f_image_url').value = '';
    const box = document.getElementById('imagePreviewBox');
    box.classList.remove('has-img');
    box.innerHTML = ICON.camera;
    document.getElementById('uploadBtnLabel').textContent = 'Загрузить фото';
}

// ==================== СОХРАНЕНИЕ ====================
document.getElementById('sheetSave').addEventListener('click', async () => {
    const idInput = document.getElementById('f_id');
    if (!idInput) return;
    const idValue = idInput.value.trim();
    if (!idValue) { toast('Заполните поле ID', 'error'); setFormLang('ru'); return; }
    if (!/^[a-zA-Z0-9_-]+$/.test(idValue)) { toast('ID: только латиница, цифры, - и _', 'error'); return; }

    const btn = document.getElementById('sheetSave');
    btn.disabled = true;
    try {
        if (editingType === 'oysters') {
            const g = id => document.getElementById(id)?.value || '';
            const payload = {
                id: idValue,
                name: g('f_name'),
                badge: g('f_badge'),
                price: parseFloat(g('f_price')) || 0,
                sal: parseInt(g('f_sal')) || 0,
                iod: parseInt(g('f_iod')) || 0,
                sw: parseInt(g('f_sw')) || 0,
                meat: parseInt(g('f_meat')) || 0,
                region_group: g('f_region_group'),
                terroir: { ru: g('f_terroir_ru'), ro: g('f_terroir_ro'), en: g('f_terroir_en') },
                description: { ru: g('f_desc_ru'), ro: g('f_desc_ro'), en: g('f_desc_en') },
                origin: {
                    flag: g('f_origin_flag'),
                    place: { ru: g('f_place_ru'), ro: g('f_place_ro'), en: g('f_place_en') },
                    region: { ru: g('f_region_ru'), ro: g('f_region_ro'), en: g('f_region_en') },
                    text: { ru: g('f_origintext_ru'), ro: g('f_origintext_ro'), en: g('f_origintext_en') }
                },
                facts: {
                    ru: [0,1,2].map(i => g(`f_fact_ru_${i}`)),
                    ro: [0,1,2].map(i => g(`f_fact_ro_${i}`)),
                    en: [0,1,2].map(i => g(`f_fact_en_${i}`))
                },
                image_url: g('f_image_url')
            };
            await apiFetch('/api/oysters', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            await loadOysters();
            toast(editingId ? 'Устрица обновлена' : 'Устрица добавлена');
        } else if (editingType === 'categories') {
            const g = id => document.getElementById(id)?.value || '';
            const payload = {
                id: idValue,
                label: { ru: g('f_label_ru'), ro: g('f_label_ro'), en: g('f_label_en') },
                subtitle: { ru: g('f_subtitle_ru'), ro: g('f_subtitle_ro'), en: g('f_subtitle_en') },
                sort_order: parseInt(g('f_sort_order')) || 0
            };
            await apiFetch('/api/food-categories', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            await loadCategories();
            toast(editingId ? 'Категория обновлена' : 'Категория добавлена');
        } else if (editingType === 'items') {
            const g = id => document.getElementById(id)?.value || '';
            const payload = {
                id: idValue,
                category_id: g('f_category_id'),
                name: { ru: g('f_name_ru'), ro: g('f_name_ro'), en: g('f_name_en') },
                price: parseFloat(g('f_price')) || 0,
                weight: g('f_weight'),
                description: { ru: g('f_description_ru'), ro: g('f_description_ro'), en: g('f_description_en') },
                image_url: g('f_image_url'),
                sort_order: parseInt(g('f_sort_order')) || 0
            };
            await apiFetch('/api/food-items', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            await loadItems();
            toast(editingId ? 'Блюдо обновлено' : 'Блюдо добавлено');
        }
        closeSheet();
        renderList();
    } catch {
        // ошибка уже показана тостом
    } finally {
        btn.disabled = false;
    }
});

// ==================== УДАЛЕНИЕ ====================
function askDelete(type, id, name) {
    deleteAction = { type, id };
    document.getElementById('confirmText').textContent = `«${name}» будет удалено без возможности восстановления.`;
    document.getElementById('confirmOverlay').classList.add('active');
}
window.askDelete = askDelete;

document.getElementById('confirmCancel').addEventListener('click', () => {
    document.getElementById('confirmOverlay').classList.remove('active');
    deleteAction = null;
});
document.getElementById('confirmOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) { e.currentTarget.classList.remove('active'); deleteAction = null; }
});
document.getElementById('confirmOk').addEventListener('click', async () => {
    if (!deleteAction) return;
    const { type, id } = deleteAction;
    const endpoint = type === 'oysters' ? '/api/oysters' : type === 'categories' ? '/api/food-categories' : '/api/food-items';
    try {
        await apiFetch(`${endpoint}?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (type === 'oysters') await loadOysters();
        if (type === 'categories') { await loadCategories(); await loadItems(); }
        if (type === 'items') await loadItems();
        toast('Удалено');
        renderList();
    } catch {
        // ошибка уже показана тостом
    } finally {
        document.getElementById('confirmOverlay').classList.remove('active');
        deleteAction = null;
    }
});
</script>

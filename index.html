    <meta property="og:type" content="website">

    <meta property="og:description" content="Устрицы, морепродукты и авторские блюда. Меню на русском, румынском и английском.">
    <meta property="og:site_name" content="Oyster's LAB">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070b11'/%3E%3Cpath d='M32 13c-11 0-19 8.5-19 19 0 9 7 17 19 19 12-2 19-10 19-19 0-10.5-8-19-19-19z' fill='none' stroke='%23d4b062' stroke-width='3'/%3E%3Cpath d='M22 34c3-5 7-7 10-7s7 2 10 7' fill='none' stroke='%23d4b062' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='36' r='3.5' fill='%23e8cc8a'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
    <style>
        :root {
            --bg:        #070b11;
            --bg-card:   #0d131b;
            --surface:   #121a24;
            --surface-2: #18212d;
            --line:      rgba(255,255,255,0.06);
            --line-2:    rgba(255,255,255,0.10);
            --gold:      #d4b062;
            --gold-light:#e8cc8a;
            --gold-dim:  rgba(212,176,98,0.09);
            --gold-line: rgba(212,176,98,0.24);
            --sea:       #6ba39f;
            --text:      #f2eee6;
            --text-sec:  #cfc8bc;
            --body-text: #b9c3cd;
            --muted:     #8494a5;
            --danger:    #e8907f;
            --radius:    20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --fs-xs:     0.75rem;
            --fs-sm:     0.875rem;
            --fs-base:   1rem;
            --fs-md:     1.125rem;
            --fs-lg:     1.625rem;
            --fs-xl:     clamp(2.4rem, 9vw, 3.25rem);
            --tap-min:   44px;
            --shell-w:   480px;
            --gutter:    16px;
            --ease:      cubic-bezier(0.22,1,0.36,1);
            --serif:     'Cormorant Garamond', 'Times New Roman', serif;
            --sans:      'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: var(--fs-base);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        img { display: block; max-width: 100%; }

        .skip-link {
            position: absolute; top: -80px; left: 12px; z-index: 1000;
            background: var(--gold); color: #0c0f14; font-weight: 700;
            padding: 12px 18px; border-radius: var(--radius-xs); text-decoration: none;
            transition: top .2s ease;
        }
        .skip-link:focus { top: 12px; }
        :focus { outline: none; }
        :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; border-radius: 8px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ─── SHELL ─── */
        .shell {
            width: 100%; max-width: var(--shell-w); margin: 0 auto;
            min-height: 100vh; min-height: 100dvh;
            position: relative; background: var(--bg);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .glow {
            position: fixed; inset: 0 0 auto 0; height: 60vh; pointer-events: none; z-index: 0;
            background:
                radial-gradient(60% 50% at 50% 0%, rgba(212,176,98,0.07), transparent 70%),
                radial-gradient(40% 40% at 90% 10%, rgba(107,163,159,0.06), transparent 70%);
        }

        /* ─── HEADER ───
           Строка с логотипом уезжает при прокрутке (sticky с отрицательным top),
           а переключатель разделов остаётся. Значение --header-collapse считается в JS. */
        header {
            position: sticky; top: calc(-1 * var(--header-collapse, 0px)); z-index: 100;
            padding: calc(14px + env(safe-area-inset-top)) var(--gutter) 10px;
            background: rgba(7,11,17,0.95);
            backdrop-filter: saturate(140%) blur(16px);
            -webkit-backdrop-filter: saturate(140%) blur(16px);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .brand { display: flex; align-items: center; gap: 11px; min-width: 0; text-decoration: none; color: inherit; }
        .brand-mark {
            width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
            display: grid; place-items: center; color: var(--gold);
            background: linear-gradient(145deg, rgba(212,176,98,0.16), rgba(212,176,98,0.04));
            border: 1px solid var(--gold-line);
        }
        .brand-text { min-width: 0; }
        .brand h1 {
            font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1;
            letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
        }
        .brand p {
            font-size: 0.625rem; color: var(--sea); letter-spacing: 0.22em;
            text-transform: uppercase; margin-top: 5px; white-space: nowrap;
        }

        .lang-switch { display: inline-flex; flex-shrink: 0; background: var(--surface); padding: 3px; border-radius: 999px; border: 1px solid var(--line); }
        .lang-btn {
            color: var(--muted); font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.04em;
            min-width: 36px; height: 36px; border-radius: 999px; padding: 0 6px;
            transition: color .2s, background .2s;
        }
        .lang-btn:hover:not([aria-pressed="true"]) { color: var(--text); }
        .lang-btn[aria-pressed="true"] { background: var(--gold-dim); color: var(--gold-light); box-shadow: inset 0 0 0 1px var(--gold-line); }

        /* Сегментированный переключатель разделов */
        .main-nav {
            position: relative; display: grid; grid-template-columns: 1fr 1fr;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px;
        }
        .nav-indicator {
            position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
            border-radius: 10px; background: var(--gold-dim); box-shadow: inset 0 0 0 1px var(--gold-line);
            transition: transform .35s var(--ease);
        }
        .main-nav[data-active="oysters"] .nav-indicator { transform: translateX(100%); }
        .nav-btn {
            position: relative; z-index: 1; min-height: 40px;
            color: var(--muted); font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            border-radius: 10px; transition: color .25s;
        }
        .nav-btn:hover { color: var(--text); }
        .nav-btn[aria-current="page"] { color: var(--gold-light); }
        .nav-icon { display: inline-flex; }

        /* ─── TAB BARS ─── */
        .tabs-wrapper {
            position: sticky; top: var(--tabs-top, 64px); z-index: 90;
            background: rgba(7,11,17,0.95);
            backdrop-filter: saturate(140%) blur(16px);
            -webkit-backdrop-filter: saturate(140%) blur(16px);
            border-bottom: 1px solid var(--line);
        }
        .tabs-wrapper::before, .tabs-wrapper::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 1;
            opacity: 0; transition: opacity .2s;
        }
        .tabs-wrapper::before { left: 0; background: linear-gradient(270deg, transparent, var(--bg)); }
        .tabs-wrapper::after  { right: 0; background: linear-gradient(90deg, transparent, var(--bg)); }
        .tabs-wrapper.fade-l::before, .tabs-wrapper.fade-r::after { opacity: 1; }
        .tabs {
            display: flex; overflow-x: auto; gap: 8px; padding: 8px var(--gutter) 10px;
            scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; white-space: nowrap; scroll-snap-align: center;
            min-height: 40px; padding: 0 16px; border-radius: 999px;
            background: var(--surface); color: var(--muted); border: 1px solid var(--line);
            font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.01em;
            display: inline-flex; align-items: center; gap: 7px;
            transition: color .2s, background .2s, border-color .2s;
        }
        .tab:hover { color: var(--text); border-color: var(--line-2); }
        .tab[aria-selected="true"], .tab[aria-current="true"] { background: var(--gold); color: #14100a; border-color: var(--gold); }
        .tab.unavailable-tab:not([aria-selected="true"]) { opacity: .55; }
        .tab-count { font-size: 0.6875rem; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }

        main { position: relative; z-index: 1; }

        /* ─── OYSTER CARD ─── */
        .card { display: none; padding: 0 var(--gutter) 24px; }
        .card.active { display: block; animation: rise .45s var(--ease) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .hero { text-align: center; padding: 34px 0 22px; }
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(7,11,17,0.72); color: var(--gold-light);
            border: 1px solid var(--gold-line);
            padding: 6px 12px; border-radius: 999px; font-size: 0.6875rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .badge.danger { color: var(--danger); border-color: rgba(232,144,127,0.35); }
        .hero > .badge-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

        .oyster-name {
            font-family: var(--serif); font-size: var(--fs-xl); font-weight: 600;
            letter-spacing: 0.01em; line-height: 1.02; margin-bottom: 10px; text-wrap: balance;
        }
        .terroir { font-size: var(--fs-sm); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; text-wrap: balance; }
        .terroir-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sea); }
        .price-tag { display: inline-flex; align-items: baseline; gap: 8px; }
        .price-amount, .dish-price, .sheet-price { font-variant-numeric: lining-nums tabular-nums; }
        .price-amount { font-family: var(--serif); font-size: 2rem; font-weight: 700; color: var(--gold-light); line-height: 1; }
        .price-cur { font-size: var(--fs-sm); color: var(--gold); font-weight: 700; letter-spacing: 0.08em; }
        .price-unit { font-size: var(--fs-sm); color: var(--muted); }

        .info-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
        .block-label {
            font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
        }
        .block-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-line), transparent); }

        /* Вкусовой профиль: шкала из 10 делений */
        .taste-grid { display: grid; gap: 14px; }
        .taste-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
        .taste-label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-sec); }
        .taste-score { font-size: var(--fs-sm); color: var(--gold-light); font-weight: 700; font-variant-numeric: tabular-nums; }
        .taste-score small { color: var(--muted); font-weight: 500; }
        .meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
        .meter i { height: 6px; border-radius: 2px; background: rgba(255,255,255,0.06); transition: background .4s var(--ease); }
        .card.active .meter i.on { background: linear-gradient(90deg, rgba(212,176,98,0.65), var(--gold)); }
        .card.active .meter i.on:nth-child(1) { transition-delay: .05s } .card.active .meter i.on:nth-child(2) { transition-delay: .08s }
        .card.active .meter i.on:nth-child(3) { transition-delay: .11s } .card.active .meter i.on:nth-child(4) { transition-delay: .14s }
        .card.active .meter i.on:nth-child(5) { transition-delay: .17s } .card.active .meter i.on:nth-child(6) { transition-delay: .20s }
        .card.active .meter i.on:nth-child(7) { transition-delay: .23s } .card.active .meter i.on:nth-child(8) { transition-delay: .26s }
        .card.active .meter i.on:nth-child(9) { transition-delay: .29s } .card.active .meter i.on:nth-child(10){ transition-delay: .32s }
        .card:not(.bars-ready) .meter i.on { background: rgba(255,255,255,0.06); }
        .scale-hint { display: flex; justify-content: space-between; font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 14px; }

        .desc { font-size: var(--fs-md); line-height: 1.75; color: var(--body-text); margin: 22px 4px 24px; }
        .desc strong, .origin-text strong, .fact-text strong { color: var(--text); font-weight: 600; }
        .desc::first-letter { font-family: var(--serif); font-size: 3.1em; float: left; line-height: .9; margin: 4px 8px 0 0; color: var(--gold-light); font-weight: 600; }

        .origin-map-line { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
        .origin-flag { font-size: 26px; flex-shrink: 0; width: 46px; height: 46px; display: grid; place-items: center; background: var(--surface-2); border-radius: 12px; }
        .origin-place { font-size: var(--fs-base); font-weight: 700; line-height: 1.3; }
        .origin-region { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
        .origin-text { font-size: var(--fs-base); line-height: 1.75; color: var(--body-text); }

        .facts-list { display: flex; flex-direction: column; gap: 14px; counter-reset: fact; }
        .fact-item { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
        .fact-num { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; color: var(--gold); line-height: 1.1; font-variant-numeric: lining-nums; }
        .fact-text { font-size: var(--fs-base); line-height: 1.65; color: var(--body-text); }
        .fact-item + .fact-item { padding-top: 14px; border-top: 1px solid var(--line); }

        .oyster-pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
        .pager-btn {
            display: flex; flex-direction: column; gap: 2px; text-align: left;
            padding: 12px 14px; min-height: 60px; border-radius: var(--radius-sm);
            background: var(--surface); border: 1px solid var(--line); transition: border-color .2s;
        }
        .pager-btn.next { text-align: right; align-items: flex-end; }
        .pager-btn:hover { border-color: var(--gold-line); }
        .pager-dir { font-size: 0.6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
        .pager-name { font-weight: 600; font-size: var(--fs-sm); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

        /* ─── FOOD MENU ─── */
        .food-category-section { padding-top: 6px; scroll-margin-top: 140px; }
        .section-head { padding: 26px var(--gutter) 14px; }
        .section-eyebrow { display: flex; align-items: center; gap: 10px; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
        .section-eyebrow::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-line), transparent); }
        .section-title { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1.05; letter-spacing: 0.005em; }
        .section-subtitle { font-size: var(--fs-sm); color: var(--muted); margin-top: 6px; line-height: 1.55; max-width: 52ch; }

        .dish-grid { padding: 0 var(--gutter); display: grid; gap: 10px; }
        .dish-card {
            position: relative; display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
            background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 12px; transition: border-color .2s, transform .2s var(--ease), background .2s;
        }
        .dish-card:hover { border-color: var(--gold-line); background: #0f161f; }
        .dish-card:active { transform: scale(0.99); }
        .dish-card.animate-in { animation: rise .45s var(--ease) both; }
        .dish-thumb {
            width: 96px; height: 96px; flex-shrink: 0; position: relative; overflow: hidden;
            border-radius: var(--radius-sm); background: radial-gradient(120% 120% at 30% 20%, var(--surface-2), var(--surface));
            display: grid; place-items: center; color: rgba(212,176,98,0.45);
        }
        .dish-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .dish-thumb svg { width: 30px; height: 30px; }
        .dish-badge {
            position: absolute; left: 6px; top: 6px; z-index: 1;
            background: var(--gold); color: #14100a; font-size: 0.625rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 7px; border-radius: 6px;
            max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dish-content { flex: 1; min-width: 0; padding: 2px 2px 0 0; }
        .dish-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .dish-name { font-size: var(--fs-base); font-weight: 600; line-height: 1.3; text-wrap: pretty; }
        .dish-price { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; color: var(--gold-light); line-height: 1.1; white-space: nowrap; flex-shrink: 0; }
        .dish-price small { font-family: var(--sans); font-size: 0.625rem; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; margin-left: 3px; }
        .dish-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: var(--fs-xs); color: var(--muted); }
        .dish-meta .pill { padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
        .dish-meta .pill.danger { color: var(--danger); border-color: rgba(232,144,127,0.3); background: rgba(232,144,127,0.08); }
        .dish-desc {
            margin-top: 6px; font-size: var(--fs-sm); color: var(--body-text); line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .dish-card.is-unavailable .dish-thumb img { filter: grayscale(.7) brightness(.7); }
        .dish-card.is-unavailable .dish-name, .dish-card.is-unavailable .dish-price { opacity: .55; }

        /* ─── DISH SHEET ─── */
        .sheet-backdrop {
            position: fixed; inset: 0; z-index: 300; display: none; align-items: flex-end; justify-content: center;
            background: rgba(4,7,11,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .sheet-backdrop.active { display: flex; animation: fade .25s ease both; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .sheet {
            position: relative; width: 100%; max-width: var(--shell-w); max-height: 92dvh; overflow-y: auto;
            background: var(--bg-card); border: 1px solid var(--line); border-bottom: 0;
            border-radius: 24px 24px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom));
            animation: sheetUp .38s var(--ease) both; overscroll-behavior: contain;
        }
        @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
        .sheet-media { position: relative; aspect-ratio: 4 / 3; background: radial-gradient(120% 120% at 30% 20%, var(--surface-2), var(--surface)); display: grid; place-items: center; color: rgba(212,176,98,0.4); }
        .sheet-media img { width: 100%; height: 100%; object-fit: cover; }
        .sheet-media svg { width: 72px; height: 72px; }
        .sheet-media::after { content: ''; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(180deg, transparent, var(--bg-card)); pointer-events: none; }
        .sheet-grabber { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35); z-index: 2; }
        .sheet-close {
            position: absolute; top: 14px; right: 14px; z-index: 3;
            width: var(--tap-min); height: var(--tap-min); border-radius: 50%;
            display: grid; place-items: center; color: var(--text);
            background: rgba(7,11,17,0.7); border: 1px solid var(--line-2);

        /* ─── STATES ─── */
        .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius-sm); }

        .skeleton-wrap { padding: 20px var(--gutter); display: grid; gap: 10px; }

        .skel-row .skeleton:first-child { width: 96px; height: 96px; flex-shrink: 0; }
        .skel-lines { flex: 1; display: grid; gap: 8px; align-content: start; padding-top: 4px; }

        .state-block { text-align: center; padding: 64px 28px; }
        .state-icon { color: var(--gold); opacity: .6; margin-bottom: 16px; display: flex; justify-content: center; }
        .state-title { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        .state-text { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
        .action-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-width: 180px; min-height: var(--tap-min); padding: 0 22px; border-radius: 999px;

            transition: background .2s;

        .action-btn:hover { background: var(--gold-light); }

        /* ─── FOOTER ─── */
        .site-footer { position: relative; z-index: 1; padding: 36px var(--gutter) calc(48px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: var(--fs-xs); }
        .footer-mark { color: var(--gold); opacity: .7; display: flex; justify-content: center; margin-bottom: 10px; }
        .footer-brand { font-family: var(--serif); font-size: 1.25rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-sec); margin-bottom: 4px; }
        .footer-note { margin-top: 10px; line-height: 1.6; }

        /* ─── BACK TO TOP ─── */
        .to-top {
            position: fixed; z-index: 120; bottom: calc(18px + env(safe-area-inset-bottom));
            right: max(16px, calc((100vw - var(--shell-w)) / 2 + 16px));

            transition: opacity .25s, transform .3s var(--ease);
        }
        .to-top.show { opacity: 1; transform: none; pointer-events: auto; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 374px) {
            .brand-mark { display: none; }

        @media (min-width: 481px) {
            body { padding: 20px 0; }

            .sheet-backdrop { align-items: center; padding: 24px; }

            .tabs-wrapper::before, .tabs-wrapper::after { display: none; }

            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxndGd6YXpvcXplbmVkZ3piem1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTYyMjksImV4cCI6MjEwNDI3MjIyOX0.9eH14E5PbaM2PTkW9o7m2f9pCzFYdVF0NXVxZ-X57AQ';

let lastFocusedEl = null;
let lastDataSignature = '';

let FOOD_CATEGORIES = [];

// ==================== HELPERS ====================
const $ = id => document.getElementById(id);

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key, val) { try { localStorage.setItem(key, val); } catch { /* приватный режим */ } }

function detectLang() {
    const saved = storageGet(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
    const nav = (navigator.languages || [navigator.language || '']).map(l => String(l).slice(0, 2).toLowerCase());
    for (const l of nav) { if (LANGS.includes(l)) return l; }
    return 'ru';
}

// Всё, что приходит из базы, экранируем перед вставкой в HTML.
function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Для длинных текстов разрешаем только безопасное форматирование: <strong>, <b>, <em>, <i>, <br>.
function rich(str) {
    return esc(str).replace(/&lt;(\/?)(strong|b|em|i|br)\s*\/?&gt;/gi, (m, slash, tag) => `<${slash}${tag.toLowerCase()}>`);
}
function safeUrl(url) {
    if (!url || typeof url !== 'string') return '';
    try {
        const u = new URL(url, location.href);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : '';
    } catch { return ''; }
}
// Фото из Supabase отдаём через оптимизатор Vercel: он ужимает картинку до нужной
// ширины и кэширует её у себя. Это экономит трафик Supabase (лимит 5 ГБ/мес на Free)
// и в разы ускоряет загрузку меню. Если оптимизатор недоступен — откат на оригинал.
const IMG_HOST = new URL(SUPABASE_URL).host;
const CAN_OPTIMIZE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname);
function imgSrc(url, width) {
    if (!url || !CAN_OPTIMIZE) return url;
    try { if (new URL(url).host !== IMG_HOST) return url; } catch { return url; }
    return `/_vercel/image?url=${encodeURIComponent(url)}&w=${width}&q=70`;
}
function imgTag(url, width, alt) {
    const opt = imgSrc(url, width);
    return `<img src="${esc(opt)}"${opt !== url ? ` data-orig="${esc(url)}"` : ''} alt="${esc(alt)}" loading="lazy" decoding="async">`;
}

function loc(value, lang) {
    if (value == null) return '';
    if (typeof value === 'object') return value[lang] || value.ru || value.en || value.ro || '';
    return value;
}
function formatPrice(price) {
    const n = Number(price);
    if (!Number.isFinite(n)) return '—';
    return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n).replace(/ /g, ' ');
}

    const header = $('siteHeader');

}

// Высоты липкой шапки: какая часть уезжает и где «прилипают» табы.

    const header = $('siteHeader');
    const nav = $('mainNav');
    if (!header || !nav) return;
    const safeTop = parseFloat(getComputedStyle(header).paddingTop) - 14;
    const collapse = Math.max(0, nav.offsetTop - 10 - Math.max(0, safeTop));
    const root = document.documentElement.style;
    root.setProperty('--header-collapse', collapse + 'px');
    root.setProperty('--tabs-top', (header.offsetHeight - collapse) + 'px');
}

function applyData(oystersRaw, categoriesRaw, itemsRaw) {
    OYSTERS = (oystersRaw || []).map(o => ({ ...o, desc: o.description }));
    FOOD_CATEGORIES = (categoriesRaw || []).map(cat => ({
        key: String(cat.id),
        label: cat.label,
        subtitle: cat.subtitle,
        items: (itemsRaw || [])
            .filter(item => item.category_id === cat.id)
            .map(item => ({ ...item, desc: item.description }))
    }));
    if (!FOOD_CATEGORIES.some(c => c.key === String(currentFoodCategory))) {
        currentFoodCategory = FOOD_CATEGORIES.length ? FOOD_CATEGORIES[0].key : null;
    }
}

function renderAll() {
    renderTabs();

async function fetchJson(path, signal) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
        signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
    return res.json();
}

// Стратегия stale-while-revalidate: показываем меню из кэша мгновенно,
// а свежие данные подтягиваем в фоне и перерисовываем только если что-то изменилось.
async function loadData({ force = false } = {}) {
    let hadCache = false;
    if (!force) {
        try {
            const cached = JSON.parse(storageGet(CACHE_KEY) || 'null');
            if (cached && cached.oysters && cached.categories && cached.items) {
                applyData(cached.oysters, cached.categories, cached.items);
                lastDataSignature = cached.sig || '';
                renderAll();
                hadCache = true;
            }
        } catch { /* битый кэш — игнорируем */ }
    }
    if (!hadCache) renderSkeleton();

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
        const [oysters, categories, items] = await Promise.all([
            fetchJson('oysters?select=*', ctrl.signal),
            fetchJson('food_categories?select=*&order=sort_order.asc', ctrl.signal),
            fetchJson('food_items?select=*&order=sort_order.asc', ctrl.signal)
        ]);
        const raw = JSON.stringify([oysters, categories, items]);
        const newSig = raw.length + ':' + hash(raw);
        storageSet(CACHE_KEY, JSON.stringify({ sig: newSig, oysters, categories, items, t: Date.now() }));
        if (!hadCache || newSig !== lastDataSignature) {
            applyData(oysters, categories, items);
            renderAll();
        }
        lastDataSignature = newSig;
    } catch (error) {
        console.error('Не удалось загрузить данные:', error);
        if (!hadCache) renderErrorState();
    } finally {
        clearTimeout(timer);
    }
}

function hash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
}

// ==================== OYSTERS ====================
function renderTabs() {
    const t = UI[currentLang];
    const tabsEl = $('tabs');
    tabsEl.setAttribute('aria-label', t.oysters_list);
    tabsEl.innerHTML = OYSTERS.map(o => `
        <button class="tab ${o.available === false ? 'unavailable-tab' : ''}" type="button" role="tab"
            id="tab-${esc(o.id)}" data-target="${esc(o.id)}" aria-selected="false" aria-controls="card-${esc(o.id)}" tabindex="-1">${esc(o.name)}</button>
    `).join('');
}

function renderCards() {
    const t = UI[currentLang];
    const TASTE = [['sal', t.sal], ['iod', t.iod], ['sw', t.sw], ['meat', t.meat]];
    const container = $('cards-container');

    if (!OYSTERS.length) { container.innerHTML = emptyState(); return; }

    container.innerHTML = OYSTERS.map((o, idx) => {
        const unavailable = o.available === false;
        const desc = loc(o.desc, currentLang);
        const terroir = loc(o.terroir, currentLang);
        const originPlace = loc(o.origin?.place, currentLang);
        const originRegion = loc(o.origin?.region, currentLang);
        const originText = loc(o.origin?.text, currentLang);
        const facts = (o.facts?.[currentLang] || o.facts?.ru || o.facts?.en || o.facts?.ro || []).filter(f => f && String(f).trim());
        const prev = OYSTERS[(idx - 1 + OYSTERS.length) % OYSTERS.length];
        const next = OYSTERS[(idx + 1) % OYSTERS.length];
        const badges = `${o.badge ? `<span class="badge">${esc(o.badge)}</span>` : ''}${unavailable ? `<span class="badge danger">${esc(t.unavailable)}</span>` : ''}`;
        const hasOrigin = originPlace || originRegion || originText;

        return `
        <article id="card-${esc(o.id)}" class="card" role="tabpanel" aria-labelledby="tab-${esc(o.id)}" tabindex="-1">
            <div class="hero">
                ${badges ? `<div class="badge-row">${badges}</div>` : ''}
                <h2 class="oyster-name">${esc(o.name)}</h2>
                ${terroir ? `<p class="terroir"><span class="terroir-dot" aria-hidden="true"></span>${esc(terroir)}</p>` : ''}
                <div class="price-tag">
                    <span class="price-amount">${formatPrice(o.price)}</span>
                    <span class="price-cur">MDL</span>
                    <span class="price-unit">${esc(t.unit)}</span>
                </div>
            </div>

            <section class="info-block" aria-label="${esc(t.taste)}">
                <div class="block-label">${esc(t.taste)}</div>
                <div class="taste-grid">
                ${TASTE.map(([key, name]) => {
                    const v = Math.max(0, Math.min(10, Math.round(Number(o[key]) || 0)));
                    return `
                    <div class="taste-row">
                        <div class="taste-meta">
                            <span class="taste-label">${esc(name)}</span>
                            <span class="taste-score">${v}<small>/10</small></span>
                        </div>
                        <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${v}" aria-label="${esc(name)}: ${v} ${esc(t.of10)}">
                            ${Array.from({ length: 10 }, (_, i) => `<i class="${i < v ? 'on' : ''}"></i>`).join('')}
                        </div>
                    </div>`;
                }).join('')}
                </div>
                <div class="scale-hint" aria-hidden="true"><span>${esc(t.low)}</span><span>${esc(t.high)}</span></div>
            </section>

            ${desc ? `<p class="desc">${rich(desc)}</p>` : ''}

            ${hasOrigin ? `
            <section class="info-block" aria-label="${esc(t.origin)}">
                <div class="block-label">${esc(t.origin)}</div>
                <div class="origin-map-line">
                    <span class="origin-flag" aria-hidden="true">${esc(o.origin?.flag || '🌊')}</span>
                    <div>
                        <div class="origin-place">${esc(originPlace)}</div>
                        ${originRegion ? `<div class="origin-region">${esc(originRegion)}</div>` : ''}
                    </div>
                </div>
                ${originText ? `<p class="origin-text">${rich(originText)}</p>` : ''}
            </section>` : ''}

            ${facts.length ? `
            <section class="info-block" aria-label="${esc(t.facts)}">
                <div class="block-label">${esc(t.facts)}</div>
                <ol class="facts-list" role="list">
                    ${facts.map((f, fi) => `
                        <li class="fact-item">
                            <span class="fact-num" aria-hidden="true">${String(fi + 1).padStart(2, '0')}</span>
                            <p class="fact-text">${rich(f)}</p>
                        </li>`).join('')}
                </ol>
            </section>` : ''}

            ${OYSTERS.length > 1 ? `
            <nav class="oyster-pager" aria-label="${esc(t.oysters_list)}">
                <button class="pager-btn prev" type="button" data-goto="${esc(prev.id)}">
                    <span class="pager-dir">← ${esc(t.prev)}</span><span class="pager-name">${esc(prev.name)}</span>
                </button>
                <button class="pager-btn next" type="button" data-goto="${esc(next.id)}">
                    <span class="pager-dir">${esc(t.next)} →</span><span class="pager-name">${esc(next.name)}</span>
                </button>
            </nav>` : ''}
        </article>`;
    }).join('');
}

function pickOysterId() {
    const hash = decodeURIComponent(location.hash.replace('#', ''));
    if (OYSTERS.some(o => String(o.id) === hash)) return hash;
    if (OYSTERS.some(o => String(o.id) === String(currentOysterId))) return currentOysterId;
    return OYSTERS[0]?.id ?? null;
}

function showOyster(id, { replaceHash = true, focusTab = false } = {}) {
    if (id == null) return;
    const card = $('card-' + id);
    const tab = document.querySelector(`#tabs .tab[data-target="${CSS.escape(String(id))}"]`);
    if (!card || !tab) return;
    currentOysterId = String(id);
    document.querySelectorAll('#cards-container .card').forEach(c => c.classList.remove('active', 'bars-ready'));
    document.querySelectorAll('#tabs .tab').forEach(t => { t.setAttribute('aria-selected', 'false'); t.tabIndex = -1; });
    card.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    tab.tabIndex = 0;
    if (focusTab) tab.focus({ preventScroll: true });
    scrollTabIntoView($('tabs'), tab);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('bars-ready')));
    if (replaceHash && location.hash !== '#' + id) history.replaceState(null, '', '#' + encodeURIComponent(id));
}

// ==================== FOOD ====================
function renderFoodTabs() {
    const t = UI[currentLang];
    const tabsEl = $('food-tabs');
    tabsEl.setAttribute('aria-label', t.menu_categories);
    tabsEl.innerHTML = FOOD_CATEGORIES.map(c => `
        <button class="tab" type="button" data-cat="${esc(c.key)}" aria-controls="food-panel-${esc(c.key)}"
            aria-current="${c.key === String(currentFoodCategory) ? 'true' : 'false'}">${esc(loc(c.label, currentLang))}<span class="tab-count">${c.items.length}</span></button>
    `).join('');
    updateTabFades($('food-tabs'));
}

function updateFoodTabsSelection() {
    document.querySelectorAll('#food-tabs .tab').forEach(btn => {
        btn.setAttribute('aria-current', btn.dataset.cat === String(currentFoodCategory) ? 'true' : 'false');
    });
}

// Центрирует вкладку только внутри полосы табов (без прокрутки окна).
function scrollTabIntoView(bar, tab) {
    if (!bar || !tab || bar.scrollWidth <= bar.clientWidth) return;
    const b = bar.getBoundingClientRect();
    const t = tab.getBoundingClientRect();
    const left = bar.scrollLeft + (t.left - b.left) - (bar.clientWidth - t.width) / 2;
    bar.scrollTo({ left, behavior: 'smooth' });
}
function scrollActiveFoodTabIntoView() {
    const bar = $('food-tabs');
    scrollTabIntoView(bar, bar && bar.querySelector('.tab[aria-current="true"]'));
}
function updateTabFades(bar) {
    const wrap = bar && bar.parentElement;
    if (!wrap) return;
    const max = bar.scrollWidth - bar.clientWidth;
    wrap.classList.toggle('fade-l', bar.scrollLeft > 4);
    wrap.classList.toggle('fade-r', max > 4 && bar.scrollLeft < max - 4);
}

function renderFoodCards() {
    const t = UI[currentLang];
    const container = $('food-cards-container');
    if (!FOOD_CATEGORIES.length) { container.innerHTML = emptyState(); return; }

    container.innerHTML = FOOD_CATEGORIES.map((cat, ci) => {
        const label = loc(cat.label, currentLang);
        const subtitle = loc(cat.subtitle, currentLang);
        const itemsHtml = cat.items.length
            ? cat.items.map((item, idx) => {
                const name = loc(item.name, currentLang);
                const desc = loc(item.desc, currentLang);
                const unavailable = item.available === false;
                const img = safeUrl(item.image_url);
                const badge = loc(item.badge, currentLang);
                const delay = Math.min(idx * 0.04, 0.24).toFixed(2);
                return `
                <button type="button" class="dish-card animate-in ${unavailable ? 'is-unavailable' : ''}" data-id="${esc(item.id)}" style="animation-delay:${delay}s"
                    aria-label="${esc(name)}, ${formatPrice(item.price)} MDL${unavailable ? ', ' + esc(t.unavailable) : ''}. ${esc(t.view_dish)}">
                    <span class="dish-thumb" aria-hidden="true">
                        ${badge && !unavailable ? `<span class="dish-badge">${esc(badge)}</span>` : ''}
                        ${img ? imgTag(img, 256, '') : ICONS.plate}
                    </span>
                    <span class="dish-content" aria-hidden="true">
                        <span class="dish-top">
                            <span class="dish-name">${esc(name)}</span>
                            <span class="dish-price">${formatPrice(item.price)}<small>MDL</small></span>
                        </span>
                        ${(item.weight || unavailable) ? `<span class="dish-meta">
                            ${item.weight ? `<span class="pill">${esc(item.weight)}</span>` : ''}
                            ${unavailable ? `<span class="pill danger">${esc(t.unavailable)}</span>` : ''}
                        </span>` : ''}
                        ${desc ? `<span class="dish-desc">${esc(desc).replace(/&lt;\/?(strong|b|em|i)&gt;/gi, '')}</span>` : ''}
                    </span>
                </button>`;
            }).join('')
            : `<div class="state-block" style="padding:28px 16px;">
                    <div class="state-icon">${ICONS.tray}</div>
                    <p class="state-text" style="margin:0">${esc(t.empty_category_text)}</p>
               </div>`;

        return `
            <section class="food-category-section" id="food-panel-${esc(cat.key)}" data-cat-key="${esc(cat.key)}" aria-labelledby="food-heading-${esc(cat.key)}">
                <div class="section-head">
                    <div class="section-eyebrow" aria-hidden="true">${String(ci + 1).padStart(2, '0')}</div>
                    <h2 class="section-title" id="food-heading-${esc(cat.key)}">${esc(label)}</h2>
                    ${subtitle ? `<p class="section-subtitle">${esc(subtitle)}</p>` : ''}
                </div>
                <div class="dish-grid">${itemsHtml}</div>
            </section>`;
    }).join('');

    updateFoodCategoryFromScroll();
}

function scrollToFoodCategory(key, behavior = 'smooth') {
    const target = $('food-panel-' + key);
    if (!target) return;
    const tabsWrapper = document.querySelector('#section-food .tabs-wrapper');
    const offset = headerVisibleHeight() + (tabsWrapper ? tabsWrapper.offsetHeight : 0);
    const top = Math.max(0, target.getBoundingClientRect().top + window.scrollY - offset + 4);
    isProgrammaticFoodScroll = true;
    clearTimeout(programmaticFoodScrollTimeout);
    window.scrollTo({ top, behavior });
    programmaticFoodScrollTimeout = setTimeout(() => {
        isProgrammaticFoodScroll = false;
        updateFoodCategoryFromScroll();
    }, 900);
}

function updateFoodCategoryFromScroll() {
    if (isProgrammaticFoodScroll || currentSection !== 'food') return;
    const sections = document.querySelectorAll('.food-category-section');
    if (!sections.length) return;
    const tabsWrapper = document.querySelector('#section-food .tabs-wrapper');
    const triggerLine = (tabsWrapper ? tabsWrapper.getBoundingClientRect().bottom : 0) + 24;
    let activeKey = sections[0].dataset.catKey;
    // Долистали до конца страницы — активна последняя категория.
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
        activeKey = sections[sections.length - 1].dataset.catKey;
    } else {
        sections.forEach(sec => { if (sec.getBoundingClientRect().top <= triggerLine) activeKey = sec.dataset.catKey; });
    }
    if (activeKey && activeKey !== String(currentFoodCategory)) {
        currentFoodCategory = activeKey;
        updateFoodTabsSelection();
        scrollActiveFoodTabIntoView();
    }
}

function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
        scrollTicking = false;
        $('toTop').classList.toggle('show', window.scrollY > 700);
        if (isProgrammaticFoodScroll) {
            clearTimeout(programmaticFoodScrollTimeout);
            programmaticFoodScrollTimeout = setTimeout(() => {
                isProgrammaticFoodScroll = false;
                updateFoodCategoryFromScroll();
            }, 150);
            return;
        }
        updateFoodCategoryFromScroll();
    });
}

// ==================== DISH SHEET ====================
function findItem(id) {
    for (const cat of FOOD_CATEGORIES) {
        const item = cat.items.find(i => String(i.id) === String(id));
        if (item) return item;
    }
    return null;
}

function openDishSheet(item, triggerEl) {
    const t = UI[currentLang];
    lastFocusedEl = triggerEl || document.activeElement;
    const name = loc(item.name, currentLang);
    const img = safeUrl(item.image_url);
    const badge = loc(item.badge, currentLang);
    $('sheetMedia').innerHTML = img ? imgTag(img, 1080, name).replace(' loading="lazy"', '') : ICONS.plate;
    $('sheetBadges').innerHTML =
        (badge && item.available !== false ? `<span class="badge">${esc(badge)}</span>` : '') +
        (item.available === false ? `<span class="badge danger">${esc(t.unavailable)}</span>` : '');
    $('sheetName').textContent = name;
    $('sheetPrice').innerHTML = `${formatPrice(item.price)}<small>MDL</small>`;
    $('sheetWeight').textContent = item.weight || '';
    $('sheetDesc').innerHTML = rich(loc(item.desc, currentLang));

    const sheet = $('dishSheet');
    sheet.hidden = false;
    sheet.classList.add('active');
    sheet.querySelector('.sheet').scrollTop = 0;
    document.documentElement.style.overflow = 'hidden';
    document.addEventListener('keydown', handleSheetKeydown);
    $('sheetClose').focus({ preventScroll: true });
}

function closeDishSheet() {
    const sheet = $('dishSheet');
    if (!sheet.classList.contains('active')) return;
    sheet.classList.remove('active');
    sheet.hidden = true;
    document.documentElement.style.overflow = '';
    document.removeEventListener('keydown', handleSheetKeydown);
    if (lastFocusedEl && document.contains(lastFocusedEl)) lastFocusedEl.focus({ preventScroll: true });
}

function handleSheetKeydown(e) {
    if (e.key === 'Escape') { closeDishSheet(); return; }
    if (e.key !== 'Tab') return;
    const sheet = $('dishSheet');
    const focusable = Array.from(sheet.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// Свайп вниз закрывает шторку (только на мобильном, когда контент прокручен в начало).
function setupSheetSwipe() {
    const panel = document.querySelector('#dishSheet .sheet');
    let startY = null, dy = 0;
    panel.addEventListener('touchstart', e => {
        startY = panel.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0;
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
        if (startY === null) return;
        dy = Math.max(0, e.touches[0].clientY - startY);
        panel.style.transform = dy ? `translateY(${dy}px)` : '';
    }, { passive: true });
    panel.addEventListener('touchend', () => {
        if (startY === null) return;
        panel.style.transition = 'transform .25s ease';
        if (dy > 110) closeDishSheet();
        panel.style.transform = '';
        setTimeout(() => { panel.style.transition = ''; }, 260);
        startY = null;
    });
}

// ==================== SECTIONS / LANGUAGE ====================
function switchSection(section, { scroll = true } = {}) {
    const changed = section !== currentSection;
    currentSection = section;
    $('mainNav').dataset.active = section;
    document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.section === section) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
    });
    $('section-oysters').hidden = section !== 'oysters';
    $('section-food').hidden = section !== 'food';
    if (section === 'oysters') {
        showOyster(pickOysterId());
    } else if (location.hash) {
        history.replaceState(null, '', location.pathname + location.search);
    }
    if (changed && scroll && window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'auto' });
    if (section === 'food') { updateFoodCategoryFromScroll(); scrollActiveFoodTabIntoView(); }
}

function setLanguage(lang) {
    if (!UI[lang]) return;
    currentLang = lang;
    storageSet(LANG_KEY, lang);
    const t = UI[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false'));
    document.querySelectorAll('[data-t]').forEach(el => { const k = el.dataset.t; if (t[k]) el.textContent = t[k]; });
    document.querySelectorAll('[data-t-aria]').forEach(el => { const k = el.dataset.tAria; if (t[k]) el.setAttribute('aria-label', t[k]); });
    if (OYSTERS.length || FOOD_CATEGORIES.length) {
        const y = window.scrollY;
        renderAll();
        window.scrollTo(0, y);
    }
    updateStickyMetrics();
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
    $('navIconOysters').innerHTML = ICONS.oyster;
    $('navIconFood').innerHTML = ICONS.menu;
    $('brandMark').innerHTML = ICONS.logo;
    $('footerMark').innerHTML = ICONS.logo;
    $('sheetClose').innerHTML = ICONS.close;
    $('toTop').innerHTML = ICONS.up;

    setLanguage(currentLang);
    updateStickyMetrics();
    window.addEventListener('resize', () => { updateStickyMetrics(); updateTabFades($('food-tabs')); updateTabFades($('tabs')); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateStickyMetrics);
    window.addEventListener('scroll', onScroll, { passive: true });

    document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchSection(btn.dataset.section)));
    $('brandLink').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    $('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // Устрицы: клики, стрелки на клавиатуре (паттерн tablist), листалка внизу карточки.
    $('tabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (btn) showOyster(btn.dataset.target);
    });
    $('tabs').addEventListener('keydown', e => {
        const tabs = Array.from(document.querySelectorAll('#tabs .tab'));
        const i = tabs.indexOf(document.activeElement);
        if (i < 0) return;
        let n = null;
        if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
        if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
        if (e.key === 'Home') n = 0;
        if (e.key === 'End') n = tabs.length - 1;
        if (n === null) return;
        e.preventDefault();
        showOyster(tabs[n].dataset.target, { focusTab: true });
    });
    $('tabs').addEventListener('scroll', () => updateTabFades($('tabs')), { passive: true });
    $('cards-container').addEventListener('click', e => {
        const btn = e.target.closest('[data-goto]');
        if (!btn) return;
        showOyster(btn.dataset.goto);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('food-tabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        currentFoodCategory = btn.dataset.cat;
        updateFoodTabsSelection();
        scrollActiveFoodTabIntoView();
        scrollToFoodCategory(btn.dataset.cat);
    });
    $('food-tabs').addEventListener('scroll', () => updateTabFades($('food-tabs')), { passive: true });

    $('food-cards-container').addEventListener('click', e => {
        const card = e.target.closest('.dish-card');
        if (!card) return;
        const item = findItem(card.dataset.id);
        if (item) openDishSheet(item, card);
    });

    $('sheetClose').addEventListener('click', closeDishSheet);
    $('dishSheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeDishSheet(); });
    setupSheetSwipe();

    // Битая картинка → аккуратная заглушка вместо «разбитой» иконки браузера.
    document.addEventListener('error', e => {
        const img = e.target;
        if (!(img instanceof HTMLImageElement)) return;
        if (img.dataset.orig) { const o = img.dataset.orig; delete img.dataset.orig; img.src = o; return; }
        const holder = img.closest('.dish-thumb, .sheet-media');
        if (holder) { img.remove(); holder.insertAdjacentHTML('beforeend', ICONS.plate); }
    }, true);

    // Ссылка вида /#gillardeau сразу открывает нужную устрицу.
    if (location.hash.length > 1 && location.hash !== '#main-content') currentSection = 'oysters';
    switchSection(currentSection, { scroll: false });
    loadData();
});

window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.replace('#', ''));
    if (OYSTERS.some(o => String(o.id) === id)) {
        if (currentSection !== 'oysters') switchSection('oysters');
        else showOyster(id, { replaceHash: false });
    }
});

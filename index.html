<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060a10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Oyster's LAB — Гастрономический Гид</title>
    <meta name="description" content="Гастрономический гид по устрицам и винам Oyster's LAB.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap');

        :root {
            --bg:        #060a10;
            --bg-card:   #0c1118;
            --surface:   #111820;
            --surface-2: #171f2a;
            --surface-3: #1f2b3a;
            --gold:      #d4b062;
            --gold-light:#e8cc8a;
            --gold-dim:  rgba(212,176,98,0.08);
            --gold-line: rgba(212,176,98,0.18);
            --gold-glow: rgba(212,176,98,0.04);
            --text:      #f0ece4;
            --text-sec:  #c8c0b4;
            /* --muted was rgba(138,159,186,0.4) on lang-btn (~2:1 contrast, fails WCAG 1.4.3).
               --muted itself is #7a8fa3 solid, which measures ~6.45:1 on --bg — keep this,
               drop the low-alpha variant everywhere text needs to be read. */
            --muted:     #7a8fa3;
            --faint:     #1a222e;
            --header-brand: #6ba39f;
            --body-text: #b8c4d0;
            --radius:    20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --green:     #6bcf8e;
            --danger:    #e0847a;
            --fs-xs:     0.75rem;
            --fs-sm:     0.875rem;
            --fs-base:   1rem;
            --fs-md:     1.25rem;
            --fs-lg:     1.563rem;
            /* Fluid type: locks the hero name to the viewport so long EN/RO names
               (e.g. "Special Gillardeau No.2") never overflow a 320–360px screen. */
            --fs-xl:     clamp(2rem, 7.5vw, 2.9rem);
            --tap-min:   44px; /* comfortable mobile touch target */
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; background: var(--bg) !important; height: 100%; }
        select, input, textarea, button { font-family: inherit; color-scheme: dark; }
        select option { background: var(--bg-card); color: var(--text); }

        body {
            background: var(--bg) !important;
            color: var(--text);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: var(--fs-base);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        /* Visually hidden but screen-reader accessible — used for labels that
           would clutter the visual layout (e.g. select labels). */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        /* Skip link: lets keyboard users jump past the repeated header/nav,
           which sits at the top of every screen in this single-page app. */
        .skip-link {
            position: absolute; top: -60px; left: 12px; z-index: 1000;
            background: var(--gold); color: #0c0f14; font-weight: 700;
            padding: 12px 18px; border-radius: var(--radius-xs); text-decoration: none;
            transition: top 0.2s ease;
        }
        .skip-link:focus { top: 12px; }

        /* Consistent, visible focus ring across the whole app instead of relying
           on (or worse, suppressing) the browser default outline. */
        :focus { outline: none; }
        :focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 2px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow-x: clip;
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--bg);
        }

        .shell::before {
            content: '';
            position: fixed;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 480px; height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, rgba(212,176,98,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── HEADER ─── */
        header {
            padding: calc(22px + env(safe-area-inset-top)) 20px 16px;
            border-bottom: 1px solid var(--faint);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6,10,16,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            will-change: transform;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .brand { display: flex; flex-direction: column; }
        .brand h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: var(--fs-lg);
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }
        .brand p {
            font-size: var(--fs-xs);
            color: var(--header-brand);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .lang-switch { display: inline-flex; gap: 3px; background: var(--surface); padding: 4px; border-radius: 24px; border: 1px solid var(--faint); }
        .lang-btn {
            background: transparent; border: 1px solid transparent;
            /* Was rgba(138,159,186,0.4) → ~2:1 contrast on this bg. Fixed to the
               solid --muted token (~6.45:1), which passes WCAG AA comfortably. */
            color: var(--muted);
            font-size: var(--fs-xs); font-weight: 700;
            cursor: pointer; width: var(--tap-min); height: var(--tap-min); border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase; transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
        }
        .lang-btn:hover:not(.active) { color: var(--text); }
        .lang-btn.active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-line); }

        /* ─── NAV TABS ─── */
        .main-nav { display: flex; gap: 8px; }
        .nav-btn {
            flex: 1; background: var(--surface); border: 1px solid var(--faint);
            color: var(--muted); font-size: var(--fs-sm); font-weight: 600;
            padding: 13px 8px; min-height: var(--tap-min); border-radius: var(--radius-sm); cursor: pointer;
            transition: all 0.25s ease; display: flex; align-items: center;
            justify-content: center; gap: 7px; letter-spacing: 0.02em;
        }
        .nav-btn:hover { border-color: var(--gold-line); color: var(--text); }
        .nav-btn.active { background: var(--gold-dim); color: var(--gold-light); border-color: var(--gold-line); }
        .nav-btn[aria-current="page"] { background: var(--gold-dim); color: var(--gold-light); border-color: var(--gold-line); }
        .nav-icon { font-size: var(--fs-base); display: inline-flex; }

        /* ─── OYSTER TABS ─── */
        .tabs-wrapper { position: relative; }
        .tabs-wrapper::after {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 44px;
            background: linear-gradient(90deg, transparent, var(--bg)); pointer-events: none;
        }
        .tabs { display: flex; overflow-x: auto; padding: 12px 20px; gap: 8px; scroll-behavior: smooth; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            background: var(--surface); color: var(--muted); border: 1px solid var(--faint);
            padding: 10px 20px; min-height: var(--tap-min); border-radius: 20px; white-space: nowrap; font-size: var(--fs-sm);
            font-weight: 600; cursor: pointer; transition: all 0.25s ease; flex-shrink: 0;
            user-select: none; letter-spacing: 0.02em; scroll-snap-align: center;
        }
        .tab:hover { border-color: var(--gold-line); color: var(--text); }
        .tab[aria-selected="true"] { background: var(--gold-dim); color: var(--gold-light); border-color: var(--gold-line); }

        /* ─── CARDS ─── */
        .card { display: none; padding: 0 20px 80px; animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
        .card.active { display: block; }
        .card .info-block { position: relative; z-index: 1; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hero { text-align: center; padding: 28px 0 20px; position: relative; z-index: 1; }
        .badge {
            display: inline-block; background: linear-gradient(135deg, rgba(212,176,98,0.12), rgba(212,176,98,0.06));
            color: var(--gold-light); border: 1px solid rgba(212,176,98,0.25);
            padding: 7px 18px; border-radius: 20px; font-size: var(--fs-xs); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 16px;
        }
        .oyster-name {
            font-family: 'Cormorant Garamond', serif; font-size: var(--fs-xl); font-weight: 600;
            letter-spacing: 1px; line-height: 1.1; margin-bottom: 16px; color: var(--text);
        }
        .oyster-photo {
            width: 100%; aspect-ratio: 16 / 10; border-radius: var(--radius);
            background: linear-gradient(135deg, var(--surface), var(--surface-2));
            border: 1px solid var(--faint); overflow: hidden; margin-bottom: 18px;
            display: flex; align-items: center; justify-content: center; color: var(--gold); opacity: 0.75;
        }
        .oyster-photo img { width: 100%; height: 100%; object-fit: cover; }
        .price-tag {
            display: inline-flex; align-items: baseline; gap: 6px; margin-bottom: 14px;
            background: var(--gold-dim); padding: 10px 24px; border-radius: 24px; border: 1px solid var(--gold-line);
        }
        .price-amount { font-size: var(--fs-lg); font-weight: 800; color: var(--gold-light); }
        .price-unit { font-size: var(--fs-sm); color: var(--muted); font-weight: 500; }
        .terroir { font-size: var(--fs-sm); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.02em; }
        .terroir-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.5; }

        .info-block { background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
        .block-label {
            font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }
        .block-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-line), transparent); }

        .taste-row { margin-bottom: 18px; }
        .taste-meta { display: flex; justify-content: space-between; font-size: var(--fs-base); margin-bottom: 8px; }
        .taste-label { font-weight: 600; color: var(--text-sec); }
        .taste-score { color: var(--gold-light); font-weight: 700; font-variant-numeric: tabular-nums; }
        .bar-track { height: 7px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, rgba(212,176,98,0.4), var(--gold)); border-radius: 4px; width: 0%; transition: width 0.8s cubic-bezier(0.22,1,0.36,1); }
        .scale-hint { display: flex; justify-content: space-between; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; }

        .desc { font-size: var(--fs-md); line-height: 1.75; color: var(--body-text); margin-bottom: 18px; font-weight: 400; letter-spacing: 0.01em; padding: 6px 0; }
        .desc strong { color: var(--text); font-weight: 700; }

        .origin-map-line { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--faint); }
        .origin-flag { font-size: 28px; flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border-radius: 12px; }
        .origin-place { font-size: var(--fs-base); font-weight: 700; color: var(--text); line-height: 1.3; }
        .origin-region { font-size: var(--fs-sm); color: var(--muted); margin-top: 3px; letter-spacing: 0.02em; }
        .origin-text { font-size: var(--fs-base); line-height: 1.75; color: var(--body-text); font-weight: 400; }
        .origin-text strong { color: var(--text); font-weight: 600; }

        .facts-list { display: flex; flex-direction: column; gap: 10px; }
        .fact-item { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border: 1px solid rgba(255,255,255,0.03); border-radius: var(--radius-xs); padding: 14px 16px; }
        .fact-num { width: 26px; height: 26px; border-radius: 50%; background: var(--gold-dim); border: 1px solid var(--gold-line); color: var(--gold-light); font-size: var(--fs-xs); font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
        .fact-text { font-size: var(--fs-base); line-height: 1.65; color: var(--body-text); }
        .fact-text strong { color: var(--text); font-weight: 600; }

        /* ─── FOOD MENU ─── */
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 600; padding: 24px 20px 12px; color: var(--text); letter-spacing: 0.5px; }
        .dish-grid { padding: 0 20px 80px; display: flex; flex-direction: column; gap: 12px; }
        .dish-card { background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 18px; transition: border-color 0.25s ease; }
        .dish-card:hover { border-color: var(--gold-line); }
        .dish-card-inner { display: flex; gap: 14px; align-items: flex-start; }
        .dish-thumb { width: 84px; height: 84px; flex-shrink: 0; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--surface), var(--surface-2)); border: 1px dashed var(--gold-line); display: flex; align-items: center; justify-content: center; color: var(--gold); opacity: 0.7; cursor: pointer; }
        .dish-thumb svg { width: 30px; height: 30px; }
        .dish-thumb:hover, .dish-thumb:active { border-color: var(--gold); opacity: 0.95; }
        .dish-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
        .dish-content { flex: 1; min-width: 0; }
        .dish-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
        .dish-name { font-size: var(--fs-base); font-weight: 700; color: var(--text); line-height: 1.35; }
        .dish-price-chip { font-size: var(--fs-xs); font-weight: 700; padding: 5px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; margin-left: 8px; background: rgba(255,235,160,0.10); color: var(--gold-light); white-space: nowrap; }
        .dish-weight { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 10px; letter-spacing: 0.02em; }
        .dish-desc { font-size: var(--fs-sm); color: var(--body-text); line-height: 1.65; font-weight: 400; }

        /* photo lightbox */
        .photo-lightbox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(6,10,16,0.94); z-index: 300; display: none; justify-content: center; align-items: center; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 20px; }
        .photo-lightbox.active { display: flex; }
        .photo-lightbox-panel { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 20px; position: relative; animation: slideUp 0.3s cubic-bezier(0.22,1,0.36,1) forwards; }
        .photo-lightbox-close { position: absolute; top: 16px; right: 16px; background: var(--surface); border: 1px solid var(--faint); color: var(--muted); width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-xs); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s ease; z-index: 2; }
        .photo-lightbox-close:hover { border-color: var(--gold-line); color: var(--text); }
        .photo-lightbox-image { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--surface), var(--surface-2)); border: 1px dashed var(--gold-line); display: flex; align-items: center; justify-content: center; color: var(--gold); opacity: 0.75; margin-bottom: 18px; overflow: hidden; }
        .photo-lightbox-image svg { width: 88px; height: 88px; }
        .photo-lightbox-image img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
        .photo-lightbox-name { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 600; color: var(--text); text-align: center; margin-bottom: 6px; }
        .photo-lightbox-price { font-size: var(--fs-md); color: var(--gold-light); font-weight: 800; text-align: center; margin-bottom: 12px; }
        .photo-lightbox-desc { font-size: var(--fs-sm); color: var(--body-text); line-height: 1.65; text-align: center; }

        /* action bar */
        .action-bar { display: flex; gap: 8px; padding: 16px 20px 8px; justify-content: center; }
        .action-btn { background: var(--surface); border: 1px solid var(--faint); color: var(--muted); font-size: var(--fs-sm); font-weight: 600; padding: 12px 20px; min-height: var(--tap-min); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; gap: 8px; letter-spacing: 0.02em; }
        .action-btn:hover { border-color: var(--gold-line); color: var(--text); }

        /* compare overlay */
        .compare-overlay, .quiz-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; display: none; justify-content: center; align-items: center; backdrop-filter: blur(12px); }
        .compare-overlay { background: rgba(6,10,16,0.92); }
        .compare-overlay.active, .quiz-overlay.active { display: flex; }
        .compare-panel { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 20px; margin: 16px; max-height: 90vh; overflow-y: auto; }
        .compare-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .compare-panel-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 600; color: var(--text); }
        .compare-close, .quiz-close { background: var(--surface); border: 1px solid var(--faint); color: var(--muted); width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-xs); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s ease; }
        .compare-close:hover, .quiz-close:hover { border-color: var(--gold-line); color: var(--text); }
        .quiz-close { position: absolute; top: 16px; right: 16px; }
        .compare-selects { display: flex; gap: 8px; margin-bottom: 14px; }
        .compare-select { flex: 1; background: var(--surface); border: 1px solid var(--faint); border-radius: var(--radius-xs); padding: 11px 12px; min-height: var(--tap-min); font-size: var(--fs-sm); color: var(--text); font-family: 'DM Sans', sans-serif; appearance: none; cursor: pointer; color-scheme: dark; }
        .compare-select option { background: var(--bg-card); color: var(--text); }
        .compare-select:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
        .compare-go-btn { width: 100%; background: var(--gold-dim); border: 1px solid var(--gold-line); color: var(--gold-light); font-size: var(--fs-sm); font-weight: 700; padding: 13px; min-height: var(--tap-min); border-radius: var(--radius-sm); cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; transition: all 0.2s ease; margin-bottom: 12px; }
        .compare-go-btn:hover { background: var(--gold-line); color: var(--text); }
        .compare-hint { font-size: var(--fs-sm); color: var(--danger); margin-bottom: 12px; text-align: center; }
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .compare-col { background: var(--surface); border: 1px solid var(--faint); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
        .compare-col-name { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-md); font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .compare-col-price { font-size: var(--fs-sm); color: var(--gold-light); font-weight: 700; margin-bottom: 10px; }
        .compare-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--faint); font-size: var(--fs-sm); }
        .compare-row:last-child { border-bottom: none; }
        .compare-label { color: var(--muted); }
        .compare-val { font-weight: 700; color: var(--text); }
        .compare-val.winner { color: var(--gold-light); }

        /* quiz overlay */
        .quiz-overlay { background: rgba(6,10,16,0.95); }
        .quiz-card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--faint); border-radius: var(--radius); padding: 28px 24px; margin: 16px; position: relative; }
        .quiz-progress { height: 3px; background: var(--faint); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
        .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
        .quiz-title { font-family: 'Cormorant Garamond', serif; font-size: var(--fs-lg); font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .quiz-subtitle { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
        .quiz-step-label { font-size: var(--fs-xs); font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
        .quiz-question { font-size: var(--fs-md); font-weight: 600; color: var(--text); margin-bottom: 20px; line-height: 1.4; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }

async function loadData() {
    renderSkeleton();
    try {
        const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

        // Fetch all three endpoints in parallel instead of sequentially —
        // cuts perceived load time roughly to the slowest single request
        // instead of the sum of all three.
        const [oystersRes, catRes, itemsRes] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/oysters?select=*`, { headers }),
            fetch(`${SUPABASE_URL}/rest/v1/food_categories?select=*&order=sort_order.asc`, { headers }),
            fetch(`${SUPABASE_URL}/rest/v1/food_items?select=*&order=sort_order.asc`, { headers })
        ]);
        if (!oystersRes.ok || !catRes.ok || !itemsRes.ok) throw new Error('Ошибка загрузки данных');

        const [oystersRaw, categoriesRaw, itemsRaw] = await Promise.all([
            oystersRes.json(), catRes.json(), itemsRes.json()
        ]);

        OYSTERS = oystersRaw.map(o => ({ ...o, desc: o.description, regionGroup: o.region_group }));

            key: cat.id,
            label: cat.label,
            subtitle: cat.subtitle,
            items: itemsRaw.filter(item => item.category_id === cat.id).map(item => ({ ...item, desc: item.description }))
        }));

        if (!currentFoodCategory && FOOD_CATEGORIES.length) currentFoodCategory = FOOD_CATEGORIES[0].key;

        renderTabs();
        renderCards();
        renderCompareSelects();
        if (currentSection === 'food') {

            renderFoodCards();
            scrollActiveFoodTabIntoView();
        }
        handleHash();

    } catch (error) {
        console.error('Не удалось загрузить данные:', error);
        renderErrorState(loadData);
    }
}

function renderCompareSelects() {
    const opts = OYSTERS.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
    const placeholder = UI[currentLang].compare_placeholder;
    document.getElementById('compareSelect1').innerHTML = `<option value="">${placeholder}</option>` + opts;

function runCompare() {
    const t = UI[currentLang];
    const id1 = document.getElementById('compareSelect1').value;
    const id2 = document.getElementById('compareSelect2').value;
    const result = document.getElementById('compareResult');

    // Give explicit feedback instead of silently doing nothing when the
    // selection is incomplete or duplicated.
    if (!id1 || !id2 || id1 === id2) {
        result.innerHTML = `<p class="compare-hint">${t.compare_need_two}</p>`;
        return;
    }
    const o1 = OYSTERS.find(o => o.id === id1);
    const o2 = OYSTERS.find(o => o.id === id2);
    const keys = [
        { key: 'sal', name: t.sal }, { key: 'iod', name: t.iod },
        { key: 'sw', name: t.sw }, { key: 'meat', name: t.meat }
    ];
    result.innerHTML = `
        <div class="compare-grid">
            <div class="compare-col">
                <div class="compare-col-name">${o1.name}</div>
                <div class="compare-col-price">${o1.price} MDL</div>
                ${keys.map(k => `<div class="compare-row"><span class="compare-label">${k.name}</span><span class="compare-val${o1[k.key] >= o2[k.key] ? ' winner' : ''}">${o1[k.key]}/10</span></div>`).join('')}
                <div class="compare-row"><span class="compare-label">${t.origin}</span><span class="compare-val">${o1.origin.place[currentLang]}</span></div>
            </div>
            <div class="compare-col">

                <div class="compare-row"><span class="compare-label">${t.origin}</span><span class="compare-val">${o2.origin.place[currentLang]}</span></div>

    `;
}

function getQuizQuestions() {
    const t = UI[currentLang];
    return [
        { q: t.quiz_q1, opts: [t.quiz_q1a, t.quiz_q1b, t.quiz_q1c] },
        { q: t.quiz_q2, opts: [t.quiz_q2a, t.quiz_q2b, t.quiz_q2c] },
        { q: t.quiz_q3, opts: [t.quiz_q3a, t.quiz_q3b, t.quiz_q3c] },
        { q: t.quiz_q4, opts: [t.quiz_q4a, t.quiz_q4b, t.quiz_q4c] },
        { q: t.quiz_q5, opts: [t.quiz_q5a, t.quiz_q5b, t.quiz_q5c] },
        { q: t.quiz_q6, opts: [t.quiz_q6a, t.quiz_q6b, t.quiz_q6c] }
    ];
}

function calculateOysterScore(oyster, answers) {
    let score = 0;
    if (answers[0] === 0) score += oyster.sal <= 4 ? 25 : (oyster.sal <= 6 ? 12 : 0);
    if (answers[0] === 1) score += oyster.sal >= 4 && oyster.sal <= 6 ? 25 : 12;
    if (answers[0] === 2) score += oyster.sal >= 6 ? 25 : (oyster.sal >= 4 ? 12 : 0);
    if (answers[1] === 0) score += ((oyster.sw + oyster.meat) / 20) * 30;
    if (answers[1] === 1) score += (oyster.meat / 10) * 30;
    if (answers[1] === 2) score += (oyster.iod / 10) * 30;
    if (answers[2] === 0) score += oyster.meat <= 6 && oyster.sal <= 5 ? 20 : 5;
    if (answers[2] === 1) score += 15;
    if (answers[2] === 2) score += oyster.meat >= 8 || oyster.sw >= 8 ? 20 : 8;
    if (answers[3] === 0) score += oyster.sal >= 4 && oyster.sal <= 7 ? 20 : 8;
    if (answers[3] === 1) score += oyster.sw >= 6 || oyster.meat >= 7 ? 20 : 8;
    if (answers[3] === 2) score += oyster.sal <= 6 && oyster.iod <= 6 ? 20 : 8;
    const classicIds = ['finedeclaire', 'gillardeau', 'speciale'];
    const uniqueIds = ['gold', 'eleonora', 'amulet', 'boudeuse'];
    if (answers[4] === 0) score += classicIds.includes(oyster.id) ? 20 : 5;
    if (answers[4] === 1) score += uniqueIds.includes(oyster.id) ? 20 : 5;
    if (answers[4] === 2) score += 10;
    if (answers[5] === 0) score += oyster.regionGroup === 'france' ? 20 : 3;
    if (answers[5] === 1) score += oyster.regionGroup === 'ireland' ? 20 : 3;
    if (answers[5] === 2) score += 12;
    return Math.min(Math.round(score), 100);
}

function renderQuiz() {
    const t = UI[currentLang];
    const card = document.getElementById('quizCard');
    if (quizStep >= 6) { showQuizResult(); return; }
    const questions = getQuizQuestions();
    const step = questions[quizStep];
    const progress = (quizStep / 6) * 100;
    card.innerHTML = `
        <button class="quiz-close" id="quizCloseBtn" aria-label="Закрыть"></button>
        <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
        <div class="quiz-title">${t.quiz_title}</div>
        <div class="quiz-subtitle">${t.quiz_sub}</div>
        <div class="quiz-step-label">${quizStep + 1} / 6</div>
        <div class="quiz-question" id="quizQuestionLabel">${step.q}</div>
        <div class="quiz-options" role="radiogroup" aria-labelledby="quizQuestionLabel">
            ${step.opts.map((opt, i) => `<div class="quiz-opt" data-idx="${i}" role="radio" aria-checked="false" tabindex="0"><span class="quiz-opt-dot" aria-hidden="true"></span>${opt}</div>`).join('')}
        </div>
    `;
    document.getElementById('quizCloseBtn').innerHTML = ICONS.close;
    document.getElementById('quizCloseBtn').addEventListener('click', closeQuiz);
    const optionsEl = card.querySelector('.quiz-options');
    const selectOption = (opt) => {
        const idx = parseInt(opt.dataset.idx);
        quizAnswers[quizStep] = idx;
        quizStep++;
        renderQuiz();
    };
    optionsEl.addEventListener('click', (e) => {
        const opt = e.target.closest('.quiz-opt');
        if (opt) selectOption(opt);
    });
    optionsEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const opt = e.target.closest('.quiz-opt');
        if (!opt) return;
        e.preventDefault();
        selectOption(opt);
    });
    if (optionsEl.firstElementChild) optionsEl.firstElementChild.focus();
}

function openQuiz() {
    lastFocusedEl = document.activeElement;
    document.getElementById('quizOverlay').classList.add('active');
    document.addEventListener('keydown', handleOverlayKeydown);
    renderQuiz();
}

function closeQuiz() {
    document.getElementById('quizOverlay').classList.remove('active');
    document.removeEventListener('keydown', handleOverlayKeydown);
    quizStep = 0;
    quizAnswers = [];
    if (lastFocusedEl) lastFocusedEl.focus();
}

function showQuizResult() {
    const t = UI[currentLang];
    const card = document.getElementById('quizCard');
    const scored = OYSTERS.map(o => ({ oyster: o, score: calculateOysterScore(o, quizAnswers) })).sort((a, b) => b.score - a.score);
    const best = scored[0];
    card.innerHTML = `
        <button class="quiz-close" id="quizCloseBtn2" aria-label="Закрыть"></button>
        <div class="quiz-progress"><div class="quiz-progress-fill" style="width:100%"></div></div>
        <div class="quiz-result">
            <div class="quiz-result-icon" aria-hidden="true">${ICONS.result_oyster}</div>
            <div class="quiz-result-name">${best.oyster.name}</div>
            <div class="quiz-result-badge">${best.oyster.badge}</div>
            <div class="quiz-result-match">${best.score}% ${t.quiz_match}</div>
            <div class="quiz-result-desc">${best.oyster.desc[currentLang].replace(/<[^>]*>/g, '')}</div>
            <div class="quiz-result-price">${best.oyster.price} MDL</div>
            <button class="quiz-btn" id="quizAgain">${t.quiz_restart}</button>
            <button class="quiz-btn-secondary" id="quizViewOyster">${best.oyster.name} →</button>
        </div>
    `;
    document.getElementById('quizCloseBtn2').innerHTML = ICONS.close;
    document.getElementById('quizCloseBtn2').addEventListener('click', closeQuiz);
    document.getElementById('quizAgain').addEventListener('click', () => { quizStep = 0; quizAnswers = []; renderQuiz(); });
    document.getElementById('quizViewOyster').addEventListener('click', () => { closeQuiz(); showOyster(best.oyster.id); });
    card.querySelector('.quiz-btn').focus();
}

function showOyster(id) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-selected', 'false'));
    const card = document.getElementById('card-' + id);
    const tab  = document.querySelector(`#tabs .tab[data-target="${id}"]`);
    if (!card || !tab) return;
    card.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    activateBars(card);
}

function renderFoodTabs() {
    const tabsEl = document.getElementById('food-tabs');
    tabsEl.innerHTML = FOOD_CATEGORIES.map(c => `
        <button class="tab" data-cat="${c.key}" role="tab" id="food-tab-${c.key}" aria-selected="${c.key === currentFoodCategory}" aria-controls="food-panel-${c.key}">${loc(c.label, currentLang)}</button>

}

function scrollActiveFoodTabIntoView() {
    const activeTab = document.querySelector('#food-tabs .tab[aria-selected="true"]');
    if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

function renderFoodCards() {
    const t = UI[currentLang];
    const cat = FOOD_CATEGORIES.find(c => c.key === currentFoodCategory);
    const container = document.getElementById('food-cards-container');
    if (!cat) {
        container.innerHTML = `
            <div class="state-block">
                <div class="state-icon">${ICONS.tray}</div>
                <div class="state-title">${t.empty_category_title}</div>
                <p class="state-text">${t.empty_category_text}</p>
            </div>`;
        return;
    }
    if (!cat.items.length) {
        container.innerHTML = `
            <div class="state-block" id="food-panel-${cat.key}" role="tabpanel" aria-labelledby="food-tab-${cat.key}">
                <div class="state-icon">${ICONS.tray}</div>
                <div class="state-title">${t.empty_category_title}</div>
                <p class="state-text">${t.empty_category_text}</p>
            </div>`;
        return;
    }
    container.innerHTML = `
        <div class="dish-grid" id="food-panel-${cat.key}" role="tabpanel" aria-labelledby="food-tab-${cat.key}">
            ${cat.items.map((item, idx) => {
                const name = loc(item.name, currentLang);
                const desc = loc(item.desc, currentLang);
                // Deterministic, capped stagger instead of Math.random() — keeps
                // the reveal orderly and avoids a different, jumpy animation
                // sequence every single time the category is re-rendered.
                const delay = Math.min(idx * 0.05, 0.3).toFixed(2);
                return `
                <div class="dish-card animate-in" style="animation-delay: ${delay}s">
                    <div class="dish-card-inner">
                        <div class="dish-thumb" data-id="${item.id}" role="button" tabindex="0" aria-label="${t.view_photo}: ${name}">
                            ${item.image_url ? `<img src="${item.image_url}" alt="${name}" loading="lazy">` : ICONS.plate}
                        </div>
                        <div class="dish-content">
                            <div class="dish-top">
                                <div class="dish-name">${name}</div>
                                <div class="dish-price-chip">${item.price} MDL</div>
                            </div>
                            ${item.weight ? `<div class="dish-weight">${item.weight}</div>` : ''}
                            <div class="dish-desc">${desc}</div>
                        </div>
                    </div>
                </div>
            `;
            }).join('')}
        </div>
    `;
}

function openPhotoLightbox(item, triggerEl) {
    lastFocusedEl = triggerEl || document.activeElement;
    const name = loc(item.name, currentLang);
    const desc = loc(item.desc, currentLang);
    const imgContainer = document.getElementById('photoLightboxImage');
    imgContainer.innerHTML = item.image_url
        ? `<img src="${item.image_url}" alt="${name}">`
        : ICONS.plate;
    document.getElementById('photoLightboxName').textContent = name;
    document.getElementById('photoLightboxPrice').textContent = item.price + ' MDL' + (item.weight ? ' · ' + item.weight : '');
    document.getElementById('photoLightboxDesc').textContent = desc;
    document.getElementById('photoLightbox').classList.add('active');
    document.addEventListener('keydown', handleOverlayKeydown);
    document.getElementById('photoLightboxClose').focus();
}

function closePhotoLightbox() {
    document.getElementById('photoLightbox').classList.remove('active');
    document.removeEventListener('keydown', handleOverlayKeydown);
    if (lastFocusedEl) lastFocusedEl.focus();
}

// Shared Escape-to-close + focus-trap handler for the quiz / lightbox / compare
// overlays, so keyboard users can never tab out of an open modal or get stuck
// with no way to dismiss it.
function handleOverlayKeydown(e) {
    const activeOverlay = document.querySelector('.quiz-overlay.active, .photo-lightbox.active, .compare-overlay.active');
    if (!activeOverlay) return;
    if (e.key === 'Escape') {
        if (activeOverlay.id === 'quizOverlay') closeQuiz();
        else if (activeOverlay.id === 'photoLightbox') closePhotoLightbox();
        else { activeOverlay.classList.remove('active'); document.removeEventListener('keydown', handleOverlayKeydown); if (lastFocusedEl) lastFocusedEl.focus(); }
        return;
    }
    if (e.key !== 'Tab') return;
    const focusable = Array.from(activeOverlay.querySelectorAll('button, [href], select, input, [tabindex]:not([tabindex="-1"])'))
        .filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function handleHash() {
    const hash = window.location.hash.replace('#', '').toLowerCase();
    const valid = OYSTERS.find(o => o.id === hash);
    if (OYSTERS.length) showOyster(valid ? hash : OYSTERS[0].id);
}

function switchSection(section) {
    currentSection = section;
    document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.section === section;
        btn.classList.toggle('active', isActive);
        if (isActive) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
    });
    document.getElementById('section-oysters').style.display = section === 'oysters' ? '' : 'none';
    document.getElementById('section-food').style.display = section === 'food' ? '' : 'none';
    if (section === 'oysters') handleHash();
    if (section === 'food') { renderFoodTabs(); renderFoodCards(); scrollActiveFoodTabIntoView(); }
}

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang; // keeps screen readers announcing the right language
    document.querySelectorAll('.lang-btn').forEach(btn => {
        const isActive = btn.dataset.lang === lang;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    document.querySelectorAll('[data-t]').forEach(el => {
        const key = el.getAttribute('data-t');
        if (UI[lang][key]) el.textContent = UI[lang][key];
    });
    renderTabs();
    renderCards();
    renderCompareSelects();
    switchSection(currentSection);
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('navIconOysters').innerHTML = ICONS.oyster;
    document.getElementById('navIconFood').innerHTML = ICONS.menu;
    document.getElementById('compareClose').innerHTML = ICONS.close;
    document.getElementById('quizTriggerIcon').innerHTML = ICONS.target;
    document.getElementById('compareTriggerIcon').innerHTML = ICONS.scale;

    document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchSection(btn.dataset.section)));

    document.getElementById('tabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (btn) showOyster(btn.dataset.target);
    });

    document.getElementById('food-tabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (btn) { currentFoodCategory = btn.dataset.cat; renderFoodTabs(); renderFoodCards(); scrollActiveFoodTabIntoView(); }
    });

    document.getElementById('quizTrigger').addEventListener('click', openQuiz);
    document.getElementById('quizOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeQuiz(); });

    document.getElementById('compareTrigger').addEventListener('click', () => {
        lastFocusedEl = document.activeElement;
        document.getElementById('compareOverlay').classList.add('active');
        document.addEventListener('keydown', handleOverlayKeydown);
        document.getElementById('compareSelect1').focus();
    });
    document.getElementById('compareClose').addEventListener('click', () => {
        document.getElementById('compareOverlay').classList.remove('active');
        document.removeEventListener('keydown', handleOverlayKeydown);
        if (lastFocusedEl) lastFocusedEl.focus();
    });
    document.getElementById('compareOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) {
            e.currentTarget.classList.remove('active');
            document.removeEventListener('keydown', handleOverlayKeydown);
            if (lastFocusedEl) lastFocusedEl.focus();
        }
    });
    document.getElementById('compareBtn').addEventListener('click', runCompare);

    document.getElementById('photoLightboxClose').innerHTML = ICONS.close;
    document.getElementById('photoLightboxClose').addEventListener('click', closePhotoLightbox);
    document.getElementById('photoLightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closePhotoLightbox(); });

    // Delegated click + keyboard (Enter/Space) handling for dish photo thumbnails.
    // The original markup had role="button" tabindex="0" but no keydown listener,
    // so keyboard-only users had no way to open the photo lightbox.
    const openThumb = (thumb) => {
        const cat = FOOD_CATEGORIES.find(c => c.key === currentFoodCategory);
        const item = cat && cat.items.find(i => i.id === thumb.dataset.id);
        if (item) openPhotoLightbox(item, thumb);
    };
    document.getElementById('food-cards-container').addEventListener('click', e => {
        const thumb = e.target.closest('.dish-thumb');
        if (thumb) openThumb(thumb);
    });
    document.getElementById('food-cards-container').addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const thumb = e.target.closest('.dish-thumb');
        if (!thumb) return;
        e.preventDefault();
        openThumb(thumb);
    });

    loadData().then(() => setLanguage(currentLang));
});

window.addEventListener('hashchange', handleHash);
